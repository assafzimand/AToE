      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    # 6 leaves off the 60x4 root in the 24-Jul run.
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  # PHASE 3 budget (top-level `epochs` = the phase-3 segment):
  # 1k Adam warmup + 40k SSBroyden (the 24-Jul warmup length).
  epochs: 41000
  eval_every: 1000
  eval_only: false
  kdv:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 16
      tol_schedule:
      - 0.01
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 2.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 1000
    mu: 0.022
    new_norm_threshold: 0.2
    output_dim: 1
    pretrained_base_checkpoint: null
