# ══════════════════════════════════════════════════════════════════════════
# RESULTS RUN — FULL FLOW WITH THE 4x60 ROOT: the 24-Jul showcase setting,
# upgraded with everything the investigation proved. 3 PDEs from scratch.
# ══════════════════════════════════════════════════════════════════════════
#
# RATIONALE: the 24-Jul run (commit 0894149, checkpoints verified in
# roots_checkpoints/double_precision) is the best phase-3-vs-root result on
# record: 6 experts totaling ~1/2 the root's parameters matched the root
# (2.29e-7 vs 1.72e-7, burgers). Its root was [2, 60x4, out] = 11,221
# params, trained WITHOUT RAD. Since the fine-tune needs RAD, the fair
# baseline root must have it too — so THIS campaign reruns the 60x4 setting
# with RAD at the root (the one change vs 24-Jul), plus the proven recipe
# from the A/B chain:
#
#   root       [2, 60x4, out]: 1k Adam (lr 1e-3) -> 40k SSBroyden,
#              RAD 0.5 re-targeted every 500.               (budget 41,000)
#   phase 3    experts [2, 20x3, out]: 1k Adam (lr 1e-3, fresh per-expert
#              draws every epoch) -> 40k SSBroyden on a STATIC uniform
#              per-expert draw (code-enforced; RAD force-disabled in code
#              — the decomposition already did the spatial adaptation, and
#              redraws under the quasi-Newton cause the memorization
#              sawtooth).                                   (budget 41,000)
#   fine-tune  SKIPPED (epochs 0) — run later from the saved checkpoints.
#              (The proven recipe when it runs: 40k pure SSBroyden, NO
#              warmup, adaptive collars q=0.9, RAD 0.5 every 500.)
#   The 1k warmup length matches the 24-Jul run exactly (both its root and
#   phase 3 switched adam -> ssbroyden at epoch 1000).
#
# Evidence for each element: warmup-vs-cold and static-vs-redraw A/Bs
# (burgers, same root/tree), the warmup5k full flow (phase 3 1.3e-7,
# fine-tune destroyed only by its Adam warmup), and the twice-verified
# no-warmup fine-tune (6.98e-8 / 7.22e-8).
#
# BENCHMARKS (this root class, from 24-Jul + verification runs):
#   burgers: root ~1.7e-7 (RAD may improve it), phase 3 ~2.3e-7,
#            fine-tune 6.98e-8 — the target: fine-tune ~ root or better.
#   allen_cahn / schrodinger: phase 3 beat or matched their roots in the
#   warmup5k run; with the smaller root the composition should lead more.
#
# Memory: root Hessian 11,221^2 -> ~1.0 GB, SSBroyden peak ~6 GB — well
# inside the A10G. Phase-3/fine-tune optimizers are smaller still.
# Recommended on the box:
#     export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#
# ORDER: schrodinger first (most leaves, biggest graph — the canary),
# then burgers, then allen_cahn.
#
# This is the DEFAULT plan: `python run_experiments.py` reads it as-is;
# AWS_scripts/run_and_terminate.sh launches it and stops the box after.
# Previous plans archived under experiment_plans/.
# ══════════════════════════════════════════════════════════════════════════
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    # FINE-TUNE SKIPPED in this campaign (epochs: 0 — the orchestrator
    # skips the segment; fine-tunes will run later from the saved
    # checkpoints). The block must stay: AToELeaves reads its collar
    # geometry from here at construction time.
    fine_tune:
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.03
      adaptive_collar_size: true
      corrector_architecture: null
      corrector_init: zero
      epochs: 0
      lr: 0.0001
      lr_schedule: none
      min_epochs: 1
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.05
      single_corrector: false
    initial_train:
      # ROOT: 1k Adam (lr 1e-3) -> 40k SSBroyden (the 24-Jul warmup length),
      # RAD 0.5 every 500.
      epochs: 41000
      lr: 0.001
      lr_decay_rate: 0.98
      lr_decay_steps: 1000
      lr_schedule: none
      lr_warmup_steps: 0
      optimizer_1: adam
      optimizer_2: ssbroyden
      optimizer_switch_epoch: 1000
    max_experts: 150
    split_icbc:
