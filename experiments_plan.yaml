# SOAP 100k: root-only vs. full phase-3 pipeline.
#
# THIS PASS RUNS ONLY VARIANT A -- three runs, one per PDE. The B variants are
# written out but commented at the bottom of this file; they will be enabled
# later and pointed at the root checkpoints these A runs produce, so the 100k
# root segment is trained once rather than twice.
#
#   A  root -> fine_tune          (adaptive_pinn.epochs = 0)      [ACTIVE]
#      The root is trained, the tree is built from it, all leaves are spawned,
#      and phase 3 is SKIPPED. The joint PoU composition is then trained
#      directly. NOTE: root (6x100) and experts (3x20) have different shapes,
#      so no parent-weight copy is possible -- the experts start from a fresh
#      init and only the tree GEOMETRY carries over from the root.
#
#   B  root -> phase 3 -> fine_tune   (the regular flow)          [DISABLED]
#      Reuses A's root, then phase 3 for 100k and fine_tune for 30k.
#
# Every segment uses SOAP with the jaxpi schedule (linear warmup 5k to 1e-3,
# then exponential decay 0.9 every 2k -> ~5.2e-6 final). Deliberately plain:
# no adaptive collars, no adaptive sampling, no collar data, no LRA, no causal
# training. sigma_fraction is fixed at 0.03 and the smoothstep order at 4 for
# every PDE (not tied to the PDE's own order).
#
# Budget: A = 200k iters/run (3 runs = 600k). B later = 130k iters/run on top
# of a reused root.
#
# Run:  python run_experiments.py experiment_plans/soap_100k_root_vs_phase3.yaml
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  soap:
    # Released jaxpi SOAP config (examples/*/configs/*soap.py), which is the
    # artifact behind the published PINN numbers. The paper text instead
    # recommends beta1=0.99 from its ablation -- worth a later sweep.
    betas:
    - 0.9
    - 0.999
    # EMA decay of the Shampoo preconditioner. Upstream's -1 sentinel reuses
    # betas[1], which would silently stretch the preconditioner's memory to
    # 0.999 (~1000 steps) purely as a side effect of the beta2 above. The SOAP
    # paper runs betas (0.95, 0.95), i.e. a 0.95 preconditioner EMA, so pin it
    # there and let beta2 govern Adam's second moment alone.
    shampoo_beta: 0.95
    precondition_frequency: 2
    weight_decay: 0.0
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      corrector_architecture: null
      corrector_init: zero
      single_corrector: false
      epochs: 100000
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 5000
      lr_decay_rate: 0.9
      lr_decay_steps: 2000
      # Grace period before the plateau test can fire. Covers the 5k-step
      # warmup plus 5k of decay, so a noisy/flat rel-L2 during the LR ramp
      # cannot early-stop the segment. Fine-tune reads this key; root and
      # phase 3 read the top-level min_epochs instead.
      min_epochs: 10000
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.03
      adaptive_collar_size: false
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_min: 0.02
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_grid: 257
    initial_train:
      epochs: 100000
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 5000
      lr_decay_rate: 0.9
      lr_decay_steps: 2000
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 4
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 4
    window_type: smoothstep
  cuda: true
  epochs: 100000
  eval_every: 1000
  eval_only: false
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.9
  lr_decay_steps: 2000
  lr_schedule: exponential
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 5000
  # Applies to the root and phase-3 segments (fine_tune has its own key).
  min_epochs: 10000
  model: AToELeaves
  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 99999
  # Stop a segment after 10 consecutive evals (= 10k epochs at eval_every
  # 1000) without a >1% rel-L2 improvement over the patience-local best.
  # The counter resets on any qualifying improvement, so this is "10k epochs
  # since the last real gain", not a wall-clock cap.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float32
  print_every: 1000
  # Bounded torch.profiler window per segment, written to
  # <run_dir>/profile_<segment>.txt. Observer only: no RNG or tensor math is
  # touched, so results are bit-identical with it on or off, and any profiler
  # error disables itself and lets training continue. 55 of 100k epochs are
  # recorded, so the cost is seconds. Read the PERCENTAGES in the report --
  # absolute times inside a profiled window are inflated by the profiler.
  profiling:
    enabled: true
    segments: all
    start_epoch: 2000
    warmup: 5
    active: 50
    top_k: 30
    record_shapes: false
    emit_trace: false
  problem: burgers1d
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    # Floor on RESIDUAL points per expert in phase 3. The global draw is
    # filtered by region, so thin leaves would otherwise get very few points;
    # anything short is topped up with a uniform draw inside its own box.
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 8192
    plot_samples_every: 0
    resample_every_epochs: 1
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    wavelet_threshold: 0.1
    window_smoothness_order: 4
    window_type: smoothstep
  seed: 42
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: soap_100k_root_vs_phase3
experiments:
# ── A: root -> fine_tune (phase 3 skipped via epochs: 0) ──
- name: burgers1d_A_root_finetune
  problem: burgers1d
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_A_root_finetune
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: schrodinger_A_root_finetune
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 20, 20, 20, 2]
# ── B: root -> phase 3 -> fine_tune (regular flow) ── DISABLED FOR NOW ──
#
# Enabled in a later pass, reusing the root that the A runs above produce, so
# the 100k root segment is not retrained. Before uncommenting, point each
# problem's pretrained_base_checkpoint at the corresponding A run's root
# checkpoint, e.g.
#
#     <problem>:
#       pretrained_base_checkpoint: outputs/experiments/soap_100k_root_vs_phase3_<ts>/
#                                   <arch-dir>/<run-ts>/checkpoints/best_model_root.pt
#
# With the root loaded the orchestrator logs "Root skipped" and goes straight
# to the tree build, so these become phase3(100k) -> fine_tune(30k).
#
# - name: burgers1d_B_phase3_finetune
#   problem: burgers1d
#   model: AToELeaves
#   epochs: 100000
#   adaptive_pinn:
#     fine_tune:
#       epochs: 30000
#   base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
#   experts_architecture: [2, 20, 20, 20, 1]
# - name: allen_cahn_B_phase3_finetune
#   problem: allen_cahn
#   model: AToELeaves
#   epochs: 100000
#   adaptive_pinn:
#     fine_tune:
#       epochs: 30000
#   base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
#   experts_architecture: [2, 20, 20, 20, 1]
# - name: schrodinger_B_phase3_finetune
#   problem: schrodinger
#   model: AToELeaves
#   epochs: 100000
#   adaptive_pinn:
#     fine_tune:
#       epochs: 30000
#   base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
#   experts_architecture: [2, 20, 20, 20, 2]
