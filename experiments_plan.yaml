# ==========================================================================
# KDV f32 PHASE-3 — SMALLER-EXPERTS PAIR (2026-08-27, main). ACTIVE: 2
# runs, root LOADED (root training skipped, ft 0) from the roots-grid
# winner (adam 50k flat + lbfgs 0.1):
#   roots_checkpoints/single_precision/kdv_adm50-lbfgs40-full-batch-
#   root-128x6-max-order1-norm-interface-no-schedule.pt
# Cells (W3, time marching STRUCTURE ONLY):
#   M12 linear_zero -> [0, 4, 8]  experts 3x40  (W0 = one whole-window
#      expert)
#   M15 linear      -> [3, 5, 7]  experts 3x30
# Commented below: M18 e3x30 (already run) + the larger-experts cells
# (M18 e3x40, M12zero e3x50, M15 e3x40) held back.
# Phase 3 = the root's scheme: 50k FLAT adam 1e-3 (no scheduler/warmup)
# -> 40k lbfgs lr 0.1 strong-Wolfe (90k, switch 50000). float32, RFF
# everywhere (dim auto -> width, scale 2, periodic false), ic/bc AND
# interface_ic/interface_bc 1000, bc + interface max order 1, INTERFACE
# normalization ON / BC normalization OFF (see 2026-08-26 note: periodic
# bc pairing is a scale-free equality — only interface terms need norm),
# freeze_stop 1001, patience 30, full batch (adam fresh 20k/epoch, lbfgs
# static pool), min-per-expert 2048, eval 1000, seed 42.
# ON HOLD below (commented): f64 phase-3 tree grid from the 5x60 roots.
# (f32 roots grid deleted 2026-08-26 — done; winner = adam50k/lbfgs01.)
# ==========================================================================
base_config:
  activation: tanh
  adam:
    betas: [0.9, 0.999]
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune: {adaptive_collar_grid: 257, adaptive_collar_quantile: 0.9, adaptive_collar_sigma_max: 0.5,
      adaptive_collar_sigma_min: 0.05, adaptive_collar_size: false, collar_data_ratio: 0.3, corrector_architecture: null,
      corrector_init: zero, epochs: 40000, lr: 0.0001, lr_schedule: none, min_epochs: 1, optimizer_1: ssbroyden,
      optimizer_2: null, optimizer_switch_epoch: 99999, sigma_fraction: 0.03, single_corrector: false}
    initial_train: {epochs: 41000, lr: 0.001, lr_decay_rate: 0.98, lr_decay_steps: 1000, lr_schedule: none,
      lr_warmup_steps: 0, optimizer_1: adam, optimizer_2: ssbroyden, optimizer_switch_epoch: 1000}
    max_experts: 150
    split_icbc: {bc_term_normalization: false, enabled: true, interface_order_decay: 1.0, interface_term_normalization: false,
      max_interface_derivative_order: null}
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling: {adaptive_ratio: 0.3, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    bc_max_derivative_order: null
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1.0]
    expert_grad_clip_norm: null
    fourier_features: {dim: 10, enabled: false, periodic: false, scale: 3.0}
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 100}
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: roots_checkpoints/double_precision/reproduce-current-code/allen_cahn_experts.pt
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [-1.0, 1.0]
    temporal_domain: [0.0, 1.0]
    time_marching: {enabled: false, freeze_previous_windows: true, m_distribution: quadratic, num_windows: 5}
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  base_architecture: [2, 60, 60, 60, 60, 1]
  batch_size: 99999
  burgers1d:
    adaptive_sampling: {adaptive_ratio: 0.5, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    bc_max_derivative_order: null
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1.0]
    expert_grad_clip_norm: null
    fourier_features: {dim: 128, enabled: false, periodic: false, scale: 1.0}
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 100}
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: roots_checkpoints/double_precision/reproduce-current-code/burgers_experts.pt
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [-1.0, 1.0]
    temporal_domain: [0.0, 1.0]
    time_marching: {enabled: false, freeze_previous_windows: true, m_distribution: quadratic, num_windows: 5}
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  epochs: 41000
  eval_every: 1000
  eval_only: false
  experts_architecture: [2, 24, 24, 24, 1]
  freeze_stop_epochs: 0
  kdv:
    adaptive_sampling: {adaptive_ratio: 0.3, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 16
      tol_schedule: [0.01]
    expert_grad_clip_norm: null
    fourier_features: {dim: 10, enabled: false, periodic: false, scale: 2.0}
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 1000}
    mu: 0.022
    new_norm_threshold: 0.2
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [-1.0, 1.0]
    temporal_domain: [0.0, 1.0]
    time_marching: {enabled: true, freeze_previous_windows: true, m_distribution: quadratic, num_windows: 3}
    tree_smoothness_threshold: 0.4
    wavelet_threshold: 0.0025
    window_smoothness_order: 3
    window_type: smoothstep
  ks:
    adaptive_sampling: {adaptive_ratio: 0.5, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    alpha: 6.25
    beta: 0.390625
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1]
    expert_grad_clip_norm: null
    fourier_features: {dim: 10, enabled: false, periodic: false, scale: 1.0}
    gamma: 0.00152587890625
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 100}
    new_norm_threshold: 10.0
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [0.0, 6.283185307179586]
    temporal_domain: [0.0, 1.0]
    time_marching: {enabled: true, freeze_previous_windows: true, m_distribution: quadratic, num_windows: 5}
    tree_smoothness_threshold: 0.3
    wavelet_threshold: 0.04
    window_smoothness_order: 4
    window_type: smoothstep
  lbfgs: {history_size: 100, line_search: strong_wolfe, lr: 1.0, max_iter: 1, tolerance_change: 0.0, tolerance_grad: 0.0}
  lr: 0.001
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_schedule: none
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 0
  min_epochs: 1
  model: AToELeaves
  multi_optimizers: false
  optimizer_1: adam
  optimizer_2: ssbroyden
  optimizer_switch_epoch: 1000
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float64
  print_every: 1000
  problem: allen_cahn
  profiling: {enabled: false}
  refresh_2nd_order_optimizer: false
  resume_from: null
  sampling: {collar_data_ratio: 0.0, collar_margin: 1.0, eval_train_ratio: 0.25, min_points_per_expert: 4096,
    n_boundary_train: 256, n_initial_train: 256, n_residual_train: 20000, plot_samples_every: 1000, rad_pool_chunk: 5000,
    rad_pool_size: 100000, resample_every_epochs: 99999, sample_volume_ratio: 35}
  save_every: 999999
  schrodinger:
    adaptive_sampling: {adaptive_ratio: 0.3, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    bc_max_derivative_order: null
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1.0]
    expert_grad_clip_norm: null
    fourier_features: {dim: 128, enabled: false, periodic: false, scale: 1.0}
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 100}
    new_norm_threshold: 2.0
    output_dim: 2
    pretrained_base_checkpoint: roots_checkpoints/double_precision/no_resample-4-60-roots/schrodinger_root.pt
    pretrained_local_expert_checkpoint: null
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [-5.0, 5.0]
    temporal_domain: [0.0, 1.5707963267948966]
    time_marching: {enabled: false, freeze_previous_windows: true, m_distribution: quadratic, num_windows: 5}
    tree_smoothness_threshold: 0.7
    wavelet_threshold: 0.1
    window_smoothness_order: 2
    window_type: smoothstep
  seed: 42
  soap:
    betas: [0.95, 0.95]
    precondition_frequency: 10
    weight_decay: 0.0
  ssbroyden: {lr: 1.0, tolerance_grad: 1.0e-10}
