experiment_name: full_flow_root60x4_rad_warmup
experiments:
# Root [2, 60x4, out] = 11,221 params (11,282 for schrodinger) — the 24-Jul
# showcase root size. Experts [2, 20x3, out] = 921/942 each.
# SCHRODINGER FIRST: most leaves, biggest graph.
- name: schrodinger_full_flow
  problem: schrodinger
  model: AToELeaves
  base_architecture: [2, 60, 60, 60, 60, 2]
  experts_architecture: [2, 20, 20, 20, 2]
- name: burgers1d_full_flow
  problem: burgers1d
  model: AToELeaves
  base_architecture: [2, 60, 60, 60, 60, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_full_flow
  problem: allen_cahn
  model: AToELeaves
  base_architecture: [2, 60, 60, 60, 60, 1]
  experts_architecture: [2, 20, 20, 20, 1]
