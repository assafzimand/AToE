# KDV f32 FT-ONLY GRID — NEW e3x35 EXPERTS (50ADAM-40LBFGS LINE), SW LR SWEEP
# (2026-09-03, main). ACTIVE: 4 runs = fine-tune only on the e3x35 p3
# checkpoint kdv_adam50-lbfgs40_full_batch_max_order1_nor_uface_only_
# 3x35_17experts_no_scheduele.pt (M18 W3-linear -> 17 leaves 3x35,
# from run kdv_p3_f32_M18W3lin_e3x35_50a40l; p3 rel-L2 1.28814e-2
# @ ep83k — FIRST p3 below the champion root 1.3197e-2). Grid: SW
# lbfgs.lr in {0.1, 0.01, 0.001, 0.0001}; fixed sigma 0.03, collar 0.3,
# 30k budget, static 20k pool, patience OFF (999999), freeze_stop 1001,
# top-level epochs 0 (ft-only — REQUIRED since epochs>0 now continues
# phase 3 on loaded experts), weights 1k, bc max order 1, f32, seed 42.
# NOTE these experts are LBFGS-settled (freeze law predicts SW freezes;
# this grid is the e3x35 data point + blend numbers per sigma).
# ON HOLD below (commented): joint no-p3 M18e3x30 (created 2026-09-01),
# e3x35 50adam-line p3 (launched 2026-09-01, RAN -> this ckpt), collar
# ft grid2 (launched 2026-09-01), M12W3linzero e3x50 p3 (launched
# 2026-09-01), 8-cell ft grid (launched 2026-08-31), M12W3linzero e3x40
# p3 (launched 2026-08-31), p3-lbfgs continuation (stopped), 30+30
# full-flow (ran), e3x35 withsched p3 (ran), f64 ssb ft rerun (froze),
# stage-1 p3 pairs, complete-lbfgs resume, f64 ssb ft grid, adam200k
# roots, ft ablation v2, f64 repro, f64 p3 grid.
# ==========================================================================
