# ==========================================================================
# FINE-TUNE FACTORIAL, NO-RESAMPLE PIPELINE (60x4 experts): 2x2x2 =
# {sigma 0.05 | adaptive collar} x {ssbroyden lr 1 | 0.01} x
# {collar_data 0.3 no-anneal | 0.5 annealed to 0}.
# 3 PDEs x 8 cells = 24 cells, fine-tune only, 40k SSBroyden, NO warmup.
# ==========================================================================
#
# Experts (full AToE state incl. the 60x4 root) load from
# roots_checkpoints/double_precision/no_resample-4-60-roots/. RAD is OFF
# everywhere (per-PDE adaptive_sampling disabled). cd03 cells are fully
# STATIC (global cadence 99999): the 0.3 collar share is drawn once in the
# segment-start draw. Only cd05an0 cells resample (fine_tune-local cadence
# 500; uniform + collar-focused redraws, no RAD) -- the annealing rides on
# those redraws.
#
# DIMENSIONS (2 options each):
#   collar   s005 = fixed sigma 0.05 | ada = adaptive q=0.9 clamp [0.05,0.5]
#   lr       ssbroyden trial step 1.0 (global default) | 0.01 (override)
#   cd       cd03    = collar_data_ratio 0.3, no annealing, STATIC draw
#            cd05an0 = collar_data_ratio 0.5 annealed linearly to 0 by 40k
#                      (collar_data_annealing: 0.0), resample every 500
#
# NOTE: first live use of fine_tune.resample_every_epochs and
# collar_data_annealing -- confirm the [Sampling]/[CollarAnneal] lines at
# segment start.
#
# All cells: 40k pure SSBroyden fine-tune (no Adam warmup), float64, full
# batch, eval_every 1000 x patience 5 (5k window). Starting compositions
# are logged at load ([PretrainedExperts] recorded rel-L2).
#
# This is the DEFAULT plan: `python run_experiments.py` reads it as-is;
# AWS_scripts/run_and_terminate.sh launches it and stops the box after.
# ==========================================================================
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    # FINE-TUNE (the only segment that runs): 40k PURE SSBroyden — NO Adam
    # warmup. Adaptive collars q=0.9 clamped [0.05, 0.5] are the BASELINE;
    # cells 2-3 override to fixed sigma, cells 4-5 switch on the single
    # corrector. The lr key is inert (Adam-only); SSBroyden reads the
    # ssbroyden block. sigma_fraction is the fallback if sizing fails.
    fine_tune:
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.05
      adaptive_collar_size: true
      corrector_architecture: null
      corrector_init: zero
      epochs: 40000
      lr: 0.0001
      lr_schedule: none
      min_epochs: 1
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.05
      single_corrector: false
    initial_train:
      # ROOT — SKIPPED in every cell (pretrained_local_expert_checkpoint is
      # set, which skips root AND phase 3; this block is ignored).
      epochs: 41000
      lr: 0.001
      lr_decay_rate: 0.98
      lr_decay_steps: 1000
      lr_schedule: none
      lr_warmup_steps: 0
      optimizer_1: adam
      optimizer_2: ssbroyden
      optimizer_switch_epoch: 1000
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: roots_checkpoints/double_precision/no_resample-4-60-roots/allen_cahn_experts.pt
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: roots_checkpoints/double_precision/no_resample-4-60-roots/burgers_experts.pt
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  # PHASE 3 -- SKIPPED in every cell (pretrained experts loaded).
  epochs: 0
  # The VERIFIED stopping rule: eval 1000 x patience 10 = a 10k window. The
  # adacollar recipe has a known plateau around epochs 10-15k before its
  # second descent — the 30-Jul verified run crossed it with 2 evals to
  # spare; the 2.5k triage window executed it mid-plateau.
  eval_every: 1000
  eval_only: false
  kdv:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 16
      tol_schedule:
      - 0.01
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 2.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 1000
    mu: 0.022
    new_norm_threshold: 0.2
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 3
    tree_smoothness_threshold: 0.4
    wavelet_threshold: 0.0025
    window_smoothness_order: 3
    window_type: smoothstep
  ks:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    alpha: 6.25
    beta: 0.390625
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 1.0
    gamma: 0.00152587890625
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 10.0
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - 0.0
      - 6.283185307179586
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.3
    wavelet_threshold: 0.04
    window_smoothness_order: 4
    window_type: smoothstep
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_schedule: none
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 0
  min_epochs: 1
  model: AToELeaves
  # Top-level keys govern PHASE 3: 1k Adam (fresh per-expert draws every
  # epoch via the Adam cadence rule) -> SSBroyden on a static draw.
  optimizer_1: adam
  optimizer_2: ssbroyden
  optimizer_switch_epoch: 1000
  # 5 evals x eval_every 1000 = 5k epochs without a 1% improvement.
  patience_evals: 5
  patience_rel_delta: 0.01
  precision: float64
  print_every: 1000
  problem: burgers1d
  profiling:
    enabled: false
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 20000
    plot_samples_every: 1000
    rad_pool_size: 100000
    rad_pool_chunk: 5000
    # NO periodic resampling (the 24-Jul regime): Adam warmups still redraw
