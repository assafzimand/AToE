# ══════════════════════════════════════════════════════════════════════════
# BURGERS PHASE 3 ONLY, STATIC DRAW A/B: does disabling the 500-epoch
# residual redraw fix the phase-3 expert stall?
# ══════════════════════════════════════════════════════════════════════════
#
# CONTEXT (full_flow_root64x5_rad, burgers cell, 20260731_130013): the root
# hit 8.89e-9 but phase 3 stalled at 8.48e-6 composed (experts 2-5e-5 each),
# ~50x worse than the 24-Jul static-draw regime where experts reached ≈ root.
# metrics.json showed the mechanism: with the 500-epoch redraw under
# SSBroyden, each 921-param expert ground its ~3k-point draw to ~2e-8 loss
# while the SAME weights scored ~1e-6 on the next fresh draw — a 50-250x
# memorization sawtooth with no descending envelope. The experts also left
# phase 3 with violent out-of-box behaviour (norms up to 1819 vs ≤26 in the
# verified pretrained set), which destroyed the soft-blend handoff
# (rel-L2 3.99 before the first fine-tune step).
#
# THE ONE CHANGE UNDER TEST: trainer/epoch_loop.py now forces phase 3 to a
# STATIC residual draw under full-batch optimizers — one per-expert draw at
# segment start, no redraws for the whole segment (Adam/SOAP, if ever used
# for a warmup, would still refresh every epoch). Everything else is
# identical to the full-flow run.
#
# THIS RUN: burgers only. Root is LOADED (the 8.89e-9 checkpoint from the
# full-flow run — copy its checkpoints/best_model_root.pt to the path below
# before launching). Fine-tune is SKIPPED (fine_tune: null), so the run is
# root-load -> tree build -> 40k phase 3, directly comparable to the
# full-flow burgers phase 3 (same root => same 6-leaf tree, same budget,
# same patience).
#
# WHAT TO COMPARE against 20260731_130013 phase 3:
#   * composed hard rel-L2: stall was best 8.48e-6 @62k, degraded to 3.2e-5.
#     Success = clear descent below ~1e-6 territory (run-1 experts ≈ 2e-7).
#   * per-expert rel-L2 curves (per_expert_rel_l2 / expert curves plot).
#   * train-loss curve: the sawtooth should be GONE (no resample events).
#   * expert out-of-box health at segment end (norm/psi dump if fine-tune
#     were enabled — here check best_model_phase3.pt norms offline).
#
# Memory: phase 3 builds one SSBroyden over 6 experts x 921 = 5,526 params
# (dense Hessian ~0.24 GB, peak ~1.5 GB) — trivial next to the root runs.
#
# This is the DEFAULT plan: `python run_experiments.py` reads it as-is;
# AWS_scripts/run_and_terminate.sh launches it and stops the box after.
# The full-flow plan is archived at experiment_plans/full_flow_root64x5_rad.yaml.
# ══════════════════════════════════════════════════════════════════════════
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    # Fine-tune SKIPPED for this A/B (null => _run_fine_tune returns
    # immediately; an {epochs: 0} block would still run collar sizing and an
    # empty segment). The full fine_tune block to restore lives in
    # experiment_plans/full_flow_root64x5_rad.yaml.
    fine_tune: null
    initial_train:
      # ROOT segment — SKIPPED in this run (burgers1d.pretrained_base_checkpoint
      # is set, which bypasses root training entirely; this block is ignored).
      epochs: 40000
      lr: 0.001
      lr_decay_rate: 0.98
      lr_decay_steps: 1000
      lr_schedule: none
      lr_warmup_steps: 0
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    # Drives the leaf count. A better root produces smaller detail
    # coefficients, so this should yield the same or FEWER leaves than the
    # 7 the 60x4 root gave. Raise it if a run reports more than ~15.
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    # The 8.89e-9 root from full_flow_root64x5_rad burgers (20260731_130013).
    # Copy that run's checkpoints/best_model_root.pt here before launching.
    # Loading it skips root training and rebuilds the same 6-leaf tree.
    pretrained_base_checkpoint: roots_checkpoints/double_precision/adaptive_sampling/burgers_root.pt
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    # 6 leaves off the 60x4 root. See the allen_cahn note above.
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  # PHASE 3 budget (the top-level `epochs` key is the phase-3 segment).
  epochs: 40000
  eval_every: 1000
  eval_only: false
  kdv:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 16
      tol_schedule:
      - 0.01
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 2.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 1000
    mu: 0.022
    new_norm_threshold: 0.2
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 3
    tree_smoothness_threshold: 0.4
    wavelet_threshold: 0.0025
    window_smoothness_order: 3
    window_type: smoothstep
  ks:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    alpha: 6.25
    beta: 0.390625
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 1.0
    gamma: 0.00152587890625
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 10.0
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - 0.0
      - 6.283185307179586
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.3
    wavelet_threshold: 0.04
    window_smoothness_order: 4
    window_type: smoothstep
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_schedule: none
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 0
  min_epochs: 1
  model: AToELeaves
  # These top-level keys are the PHASE 3 segment's optimizer (orchestrator
  # passes cfg itself as phase 3's segment config). SSBroyden throughout, no
  # Adam warmup, so no switch.
  optimizer_1: ssbroyden
  optimizer_2: null
  optimizer_switch_epoch: 99999
  # 10 evals x eval_every 1000 = 10k epochs without a 1% improvement.
  # Applies PER SEGMENT, including the root.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float64
  print_every: 1000
  problem: burgers1d
  profiling:
    enabled: false
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    # Floor on residual points per leaf in phase 3. The per-expert draw sizes
    # each leaf by volume (n_e = N * vol_e / vol_domain), so a thin leaf
    # around a sharp feature would otherwise be starved and stop training.
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 20000
    plot_samples_every: 1000
    # RAD candidate pool, redrawn uniformly every resample_every_epochs.
    # 100k against a 10k adaptive draw (n_residual_train x adaptive_ratio)
    # also puts the sampler on its without-replacement path (pool >= 4x draw).
    rad_pool_size: 100000
    # Below the 20000 default: the pool probe is a forward with 2nd
    # derivatives in float64, and in the fine-tune it runs over every leaf.
    # Chunks are independent, so this is numerically identical.
    rad_pool_chunk: 5000
    # SSBroyden honours this directly (the every-epoch override is Adam/SOAP
    # only), so both the collocation redraw and the RAD re-target happen here.
    # Applies to all three segments.
    resample_every_epochs: 500
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    # 10 leaves off the 60x4 root -- the highest of the three, and the one to
    # watch. 15 leaves would be 9.6 GB in phase 3, 20 would be 17.0 GB.
    wavelet_threshold: 0.1
    window_smoothness_order: 2
    window_type: smoothstep
  seed: 42
  soap:
    betas:
    - 0.95
    - 0.95
    precondition_frequency: 10
    weight_decay: 0.0
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: burgers_phase3_static_draw
experiments:
# Single cell: burgers, root loaded from checkpoint (architecture must match
# the checkpoint: [2, 64x5, 1]), 40k phase 3 on a STATIC per-expert draw
# (code-enforced in trainer/epoch_loop.py), no fine-tune.
- name: burgers1d_phase3_static
  problem: burgers1d
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 1]
  experts_architecture: [2, 20, 20, 20, 1]
