# ══════════════════════════════════════════════════════════════════════════
# BURGERS: ADAM-WARMUP PHASE 3 (static draw) + FULL FINE-TUNE
# ══════════════════════════════════════════════════════════════════════════
#
# Third step of the phase-3 investigation. Prior evidence, same root
# (8.89e-9, loaded from checkpoint), same 6-leaf tree:
#   * full-flow run (redraws every 500 under SSBroyden): stalled 8.48e-6,
#     memorization sawtooth, expert norms up to 1819 out-of-box, fine-tune
#     handoff destroyed (rel-L2 3.99 -> stuck at 0.25).
#   * static-draw A/B (SSBroyden cold start, no redraws): ~3.6e-6 at 18k —
#     14x better than redraws at the same epoch, but ~6x behind the proven
#     24-Jul regime (5.9e-7 @18k, best 2.29e-7 @30k).
#
# THIS RUN restores the full 24-Jul phase-3 recipe and adds the fine-tune:
#   * ADAM WARMUP: top-level optimizer_1 adam -> ssbroyden at epoch 1000
#     (per-epoch fresh draws under Adam via the built-in cadence rule, then
#     a STATIC draw under SSBroyden — code-enforced in trainer/epoch_loop.py).
#     This is the last regime difference vs the run where experts ≈ root;
#     libraries (scimba 1.3.4, torch 2.13.0) verified identical.
#   * FINE-TUNE 40k SSBroyden: adaptive collars from the root (q=0.9,
#     clamp [0.03, 0.5]), RAD 0.5 (burgers adaptive_sampling), redraw +
#     re-target every 500 — the exact recipe verified on 30 Jul (6.98e-8
#     from healthy pretrained experts).
#
# Flow: root-load -> tree -> phase 3 (1k adam + up to 39k ssbroyden) ->
# fine-tune 40k. eval_every back to 1000; patience 10 evals = 10k window.
#
# WHAT TO COMPARE:
#   * phase 3 vs 24-Jul trajectory (4.3e-6 @8k, 5.9e-7 @18k, 2.3e-7 @30k)
#     and vs the static-A/B run (3.6e-6 @18k).
#   * the [DEBUG] expert norm/psi dump at fine-tune start: healthy experts
#     read std ~O(1) (verified run: norms 8-26); monsters read 100+.
#   * fine-tune: does it beat its phase-3 start (verified run: 0.107 at
#     epoch 1 -> 5.3e-4 @1k -> 6.98e-8 final)?
#
# KNOWN CAVEAT (accepted): phase 3 ends on a multiple of 500, so the
# fine-tune's FIRST epoch is a resample epoch — RAD targets the fresh
# composition before the first optimizer step. The verified 30-Jul run
# instead had a 500-epoch uniform grace (its epochs started at 1). If this
# run's fine-tune blows up at start despite healthy experts, that
# first-epoch RAD is the prime suspect.
#
# This is the DEFAULT plan: `python run_experiments.py` reads it as-is;
# AWS_scripts/run_and_terminate.sh launches it and stops the box after.
# The full-flow plan is archived at experiment_plans/full_flow_root64x5_rad.yaml.
# ══════════════════════════════════════════════════════════════════════════
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    # FINE-TUNE ON: 40k SSBroyden, adaptive collars sized from the root at
    # q=0.9 clamped [0.03, 0.5], RAD 0.5 via burgers1d.adaptive_sampling,
    # redraw + re-target every sampling.resample_every_epochs (500).
    # Identical to the recipe verified on 30 Jul (6.98e-8 from healthy
    # experts). sigma_fraction is the fallback if collar sizing fails.
    fine_tune:
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.03
      adaptive_collar_size: true
      corrector_architecture: null
      corrector_init: zero
      epochs: 40000
      lr: 0.0001
      lr_schedule: none
      min_epochs: 1
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.05
      single_corrector: false
    initial_train:
      # ROOT segment — SKIPPED in this run (burgers1d.pretrained_base_checkpoint
      # is set, which bypasses root training entirely; this block is ignored).
      epochs: 40000
      lr: 0.001
      lr_decay_rate: 0.98
      lr_decay_steps: 1000
      lr_schedule: none
      lr_warmup_steps: 0
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    # Drives the leaf count. A better root produces smaller detail
    # coefficients, so this should yield the same or FEWER leaves than the
    # 7 the 60x4 root gave. Raise it if a run reports more than ~15.
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    # The 8.89e-9 root from full_flow_root64x5_rad burgers (20260731_130013).
    # Copy that run's checkpoints/best_model_root.pt here before launching.
    # Loading it skips root training and rebuilds the same 6-leaf tree.
    pretrained_base_checkpoint: roots_checkpoints/double_precision/adaptive_sampling/burgers_root.pt
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    # 6 leaves off the 60x4 root. See the allen_cahn note above.
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  # PHASE 3 budget (the top-level `epochs` key is the phase-3 segment).
  epochs: 40000
  eval_every: 1000
  eval_only: false
  kdv:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 16
      tol_schedule:
      - 0.01
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 2.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 1000
    mu: 0.022
    new_norm_threshold: 0.2
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 3
    tree_smoothness_threshold: 0.4
    wavelet_threshold: 0.0025
    window_smoothness_order: 3
    window_type: smoothstep
  ks:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    alpha: 6.25
    beta: 0.390625
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 1.0
    gamma: 0.00152587890625
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 10.0
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - 0.0
      - 6.283185307179586
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.3
    wavelet_threshold: 0.04
    window_smoothness_order: 4
    window_type: smoothstep
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_schedule: none
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 0
  min_epochs: 1
  model: AToELeaves
  # These top-level keys are the PHASE 3 segment's optimizer (orchestrator
  # passes cfg itself as phase 3's segment config). ADAM WARMUP restored:
  # 1000 epochs of Adam (lr 0.001, per-epoch fresh draws via the Adam
  # cadence rule) -> SSBroyden on a static draw — the 24-Jul recipe.
  # Patience resets at the switch, so SSBroyden gets a fresh grace window.
  optimizer_1: adam
  optimizer_2: ssbroyden
  optimizer_switch_epoch: 1000
  # 10 evals x eval_every 1000 = 10k epochs without a 1% improvement.
  # Applies PER SEGMENT, including the root.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float64
  print_every: 1000
  problem: burgers1d
  profiling:
    enabled: false
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    # Floor on residual points per leaf in phase 3. The per-expert draw sizes
    # each leaf by volume (n_e = N * vol_e / vol_domain), so a thin leaf
    # around a sharp feature would otherwise be starved and stop training.
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 20000
    plot_samples_every: 1000
    # RAD candidate pool, redrawn uniformly every resample_every_epochs.
    # 100k against a 10k adaptive draw (n_residual_train x adaptive_ratio)
    # also puts the sampler on its without-replacement path (pool >= 4x draw).
    rad_pool_size: 100000
    # Below the 20000 default: the pool probe is a forward with 2nd
    # derivatives in float64, and in the fine-tune it runs over every leaf.
    # Chunks are independent, so this is numerically identical.
    rad_pool_chunk: 5000
    # SSBroyden honours this directly (the every-epoch override is Adam/SOAP
    # only), so both the collocation redraw and the RAD re-target happen here.
    # Applies to all three segments.
    resample_every_epochs: 500
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    # 10 leaves off the 60x4 root -- the highest of the three, and the one to
    # watch. 15 leaves would be 9.6 GB in phase 3, 20 would be 17.0 GB.
    wavelet_threshold: 0.1
    window_smoothness_order: 2
    window_type: smoothstep
  seed: 42
  soap:
    betas:
    - 0.95
    - 0.95
    precondition_frequency: 10
    weight_decay: 0.0
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: burgers_phase3_warmup_finetune
experiments:
# Single cell: burgers, root loaded from checkpoint (architecture must match
# the checkpoint: [2, 64x5, 1]). Phase 3 = 1k adam warmup + ssbroyden on a
# static draw (code-enforced); then the full 40k fine-tune.
- name: burgers1d_phase3_warmup_ft
  problem: burgers1d
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 1]
  experts_architecture: [2, 20, 20, 20, 1]
