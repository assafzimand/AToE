# ==========================================================================
# AC / BURGERS / SCHRODINGER — 24-WIDE EXPERTS, OLD-COMMIT ARM (2026-08-23)
# Branch experts24-oldcommit = commit 8424579 ("fine tunes no RAD 1", the
# paper FINE-TUNE commit, leaves-frozen ft) + a ~12-line backport of the
# fine_tune.collar_data_ratio segment-local override from HEAD, so one run
# can do phase 3 with collar 0.0 and fine-tune with collar 0.3 (the paper's
# two-config split). Companion arm to the current-code plan on main.
# Paper run: ac_burgers_schrodinger_experts_creation_20260724_142507
# (experts @ 0894149, fine-tunes @ 8424579). At THIS commit the tree still
# fits the synthetic 200x200 lattice and solvers/split-loss match the paper
# creation run exactly, so with the paper roots LOADED the decomposition
# reproduces the paper's expert regions; experts are 2-24-24-24-1/2 (was
# 2-20-20-20-1/2). Each run: root loaded -> tree -> phase 3 (41k,
# adam->ssbroyden @1000, hard indicators) -> joint fine-tune (40k ssbroyden,
# sigma 0.05, collar 0.3, root frozen). float64, seed 42, full batch, no
# resample, no RAD/LRA/RWF/FF/causal, patience 5 x eval 1000, ssbroyden
# lr 1.0 tol 1e-10 both segments.
# Known deltas vs the paper creation run (accepted): per-expert direct
# residual draw with min_points_per_expert 4096 floor (paper: global draw,
# no floor — floor matches the current-code arm), full-batch loader without
# per-epoch shuffle, seeded weight init (irrelevant — new expert draws).
# sigma_fraction lives in fine_tune at this commit and is inert in phase 3
# (hard blending + collar off) — same single-knob semantics as HEAD.
# ==========================================================================
