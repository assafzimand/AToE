experiment_name: full_flow_root64x5_no_resample
experiments:
# Root [2, 64x5, out] = 16,897 params (16,962 schrod) -> Hessian peak
# ~13.7 GB. Experts [2, 20x3, out]. SCHRODINGER FIRST: OOM canary.
- name: schrodinger_full_flow
  problem: schrodinger
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 2]
  experts_architecture: [2, 20, 20, 20, 2]
- name: burgers1d_full_flow
  problem: burgers1d
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_full_flow
  problem: allen_cahn
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 1]
  experts_architecture: [2, 20, 20, 20, 1]
