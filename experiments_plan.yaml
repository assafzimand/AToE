    n_boundary_train: 256, n_initial_train: 256, n_residual_train: 20000, plot_samples_every: 1000, rad_pool_chunk: 5000,
    rad_pool_size: 100000, resample_every_epochs: 99999, sample_volume_ratio: 35}
  save_every: 999999
  schrodinger:
