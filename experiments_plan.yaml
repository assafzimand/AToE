    split_icbc: {bc_term_normalization: false, interface_term_normalization: true,
      max_interface_derivative_order: 1}
  base_architecture: [2, 128, 128, 128, 128, 128, 128, 1]
  epochs: 90000
  experts_architecture: [2, 30, 30, 30, 1]
  freeze_stop_epochs: 1001
  kdv:
    bc_max_derivative_order: 1
    fourier_features: {dim: auto, enabled: true, periodic: false, scale: 2.0}
    loss_weights: {bc: 1000.0, ic: 1000.0, interface_bc: 1000.0, interface_ic: 1000.0}
    pretrained_base_checkpoint: roots_checkpoints/single_precision/kdv_adm50-lbfgs40-full-batch-root-128x6-max-order1-norm-interface-no-schedule.pt
    time_marching: {debug_windows: null, last_window_checkpoint: null, m_distribution: linear,
      num_windows: 3, only_for_tree_structure: true}
  lbfgs: {history_size: 100, line_search: strong_wolfe, lr: 0.1, max_iter: 1,
    tolerance_change: 0.0, tolerance_grad: 0.0}
  lr: 0.001
  lr_schedule: none
  lr_warmup_steps: 0
  model: AToELeaves
  name: kdv_p3_f32_M15W3lin_e3x30
  optimizer_1: adam
  optimizer_2: lbfgs
  optimizer_switch_epoch: 50000
  patience_evals: 30
  precision: float32
  problem: kdv
  sampling: {min_points_per_expert: 2048}
