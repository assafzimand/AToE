    - 0.95
    precondition_frequency: 10
    weight_decay: 0.0
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: kdv_full_flow_no_resample
experiments:
# Root [2, 60x4, 1] = 11,221 params -> SSBroyden Hessian peak ~6 GB of
# the A10G's 24 GB (per window; windows run sequentially).
- name: kdv_full_flow_tm3
  problem: kdv
  model: AToELeaves
  base_architecture: [2, 60, 60, 60, 60, 1]
  experts_architecture: [2, 20, 20, 20, 1]
