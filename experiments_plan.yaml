# ==========================================================================
# OVERNIGHT PLAN 2026-08-15: 4 runs.
#
# RUN 1 - KDV WTREE M18 W3-LINEAR + INTERFACE ORDER-DECAY 0.1: identical
# to kdv_wtree_M18_W3lin_ifnorm (20260814_102454, phase-3 best 5.19e-6,
# 17 leaves) except split_icbc.interface_order_decay: 0.1 (order-k
# interface derivative term x 0.1^k on top of normalization; value term
# untouched). Measured basis: t>0.67 laggards spend 40-77% of loss
# matching root derivs 7-20x TIGHTER than the root's derivs match truth
# (root u_xx rel err 2.9e-4-8.3e-4 on those faces vs expert mismatch
# 4.3e-5) while the value term (tracks rel-L2, needs ~x100 more) gets
# 4-13%. Phase 3 only, direct A/B vs 20260814_102454.
#
# RUNS 2-4 - KS ROOT-ONLY TRIO (M_experts_num 0: nothing spawns, root
# saved as drop-in best_model_root.pt). The simple 60x4 KS root was stuck
# (rel 0.76 at the switch, residual 95% of loss). Each arm adds ONE
# mechanism; all: base [2,64,64,64,64,64,1], ic=1000, 2k Adam @1e-3 +
# 40k SSBroyden (initial_train 42000/sw2000), patience 5, tol 1e-14,
# float64, seed 42. Causal/fourier/RAD flags live ONLY in these entries
# (base_config stays clean).
#   2. ks_root_64x5_rad05:        RAD 0.5 + resample every 500 SSB epochs
#   3. ks_root_64x5_causal:       causal training (32 chunks, tol
#      [0.01,0.1,1]), STATIC sampling, no RAD (causal papers use uniform
#      draws; RAD would concentrate points where causal down-weights)
#   4. ks_root_64x5_periodic_rad05: exact periodic Fourier embedding
#      (jaxpi 2-step, L=2pi, dim 10, scale 1.0; BC terms ~0 by
#      construction - smoke-verified 2026-08-14: periodicity 4e-17,
#      u_xxxx autograd clean) + RAD 0.5/resample 500
# ==========================================================================
base_config:
  activation: tanh
  adam:
