# ==========================================================================
# KDV FINE-TUNE ABLATION, 4 CELLS (2026-08-16): fine-tune ONLY ג€” both
# checkpoints (root + experts) are loaded, so root/tree/phase-3 are all
# skipped and each cell jumps straight to the joint PoU fine-tune.
# Ablation axes: sigma_fraction x collar_data_ratio (A family) and
# bc_max_derivative_order (B family).
#
# Collar calibration (measured by MC over each tree's leaf boxes; the
# successful AC/Burgers fine-tunes ran collar_data_ratio 0.3 on a collar
# occupying ~0.107 of the domain => ~2.8x uniform density oversampling;
# KdV collar fractions: sigma 0.1 -> 0.247/0.251 (M15/M18), sigma 0.05
# -> 0.131; + ~1.1x bump because KdV's C3 smoothstep has a narrower
# active-mixing band than the references' C2):
#   sigma 0.10 -> collar_data_ratio 0.7
#   sigma 0.05 -> collar_data_ratio 0.4
#
# A family (SSBroyden, float64, ~8h/cell): dp M15 W3lin checkpoint
# (phase-3 best 5.9e-6), arch 4x60 root + 3x20 experts, no Fourier,
# ic 100 / bc 1, bc order untouched (full u,u_x,u_xx pairing), 40k pure
# SSBroyden (lr 1.0, tol 1e-14), static 20k draw (resample 99999).
#   A1: sigma 0.10, collar 0.7      A2: sigma 0.05, collar 0.4
#
# B family (Adam, float32, ~3.5h/cell): sp M18 iface1 checkpoint (Adam
# 200k experts, 1st-deriv interface), arch 5x128+FF64 root + 3x30+FF
# experts (scale 2.0, non-periodic), ic/bc 1000, lr 1e-4 flat, 50k
# steps (batch 99999999 >= 4608 pts -> 1 step = 1 epoch, fresh draw
# every step under Adam incl. collar seeding), sigma 0.10 / collar 0.7.
#   B1: bc_max_derivative_order 1   B2: bc_max_derivative_order 0
#
# Dataset cache: A needs f64/20512, B needs f32/4608 ג€” dataset_gen now
# self-heals on dtype/size mismatch (regenerates loudly), so the A->B
# transition inside one plan is safe. Order A1,A2,B1,B2 (~23h total;
# A-family OOM risk with ~21k joint params on A100-40GB shows up in
# cell 1, B cells unaffected). Patience: SSBroyden cells 10 evals x 1k
# (known ft dips tolerated), Adam cells disabled (999999); GT best-model
# selection guards against destructive fine-tuning in every cell.
# ==========================================================================
base_config:
  activation: tanh
  adam:
    betas: [0.9, 0.999]
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 20
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.05
      adaptive_collar_size: false
      collar_data_ratio: 0.5
      corrector_architecture: null
      corrector_init: zero
      epochs: 40000
      lr: 0.0001
      lr_schedule: none
      min_epochs: 1
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.2
      single_corrector: false
      ssbroyden: {lr: 1.0, tolerance_grad: 1.0e-14}
    initial_train: {epochs: 41000, lr: 0.001, lr_decay_rate: 0.98, lr_decay_steps: 1000, lr_schedule: none,
      lr_warmup_steps: 0, optimizer_1: adam, optimizer_2: ssbroyden, optimizer_switch_epoch: 1000}
    max_experts: 150
    split_icbc: {enabled: true, max_interface_derivative_order: null}
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling: {adaptive_ratio: 0.5, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1.0]
    expert_grad_clip_norm: null
    fourier_features: {dim: 10, enabled: false, periodic: false, scale: 3.0}
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 100}
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [-1.0, 1.0]
    temporal_domain: [0.0, 1.0]
    time_marching: {enabled: false, freeze_previous_windows: true, m_distribution: quadratic, num_windows: 5}
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  base_architecture: [2, 60, 60, 60, 60, 1]
