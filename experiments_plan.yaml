# ==========================================================================
# KDV PER-WINDOW EXPERTS on the NEW tol14/ic100 ROOTS, interface order
# capped at 1 (u + u_x only): 3 runs, one window each, phase 3 only.
# ==========================================================================
#
# New roots (kdv_no_resample-4-60-roots_ic_100_tol14, full 42k, no freeze):
#   W0 9.97e-9 | W1 9.40e-8 | W2 2.99e-7   (old: 2.8e-8 / 1.36e-6 / n.a.)
#
# Tested mechanism: split_icbc.max_interface_derivative_order = 1 — the
# interface transmits value + u_x only (u_xx dropped). 4 conditions per
# interior interface: over KdV's well-posed 3 by one (consistent-by-
# construction), exactly KS's 4. Removes the worst-scaled interface term
# (dxx init ~1e5 in W1 vs dx ~8e2, value ~1); with ic=100 the init loss
# terms are roughly balanced with no normalization machinery. Periodic
# pairing and the root/plain loss keep full order.
#
# Common recipe: 2k Adam + 40k SSBroyden (42000/2000), patience 5,
# tolerance_grad 1e-14, ic=100, experts 3x20, M=20 quadratic (W0 M=2 /
# W1 M=6 / W2 M=12), STATIC draws, NO fine-tune (ft.epochs 0). Each
# window loads its own new root; W1/W2 take their IC from the previous
# window's new root via last_window_checkpoint.
#
# All segments: float64, full batch, 20k residual + 256 IC/BC per window,
# resample_every_epochs 99999 (Adam warmup redraws every epoch via the
# cadence rule), eval_every 1000, seed 42.
#
# This is the DEFAULT plan: `python run_experiments.py` reads it as-is;
# AWS_scripts/run_and_terminate.sh launches it and stops the box after.
# ==========================================================================
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 20
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    # FINE-TUNE (the only segment that runs): 40k PURE SSBroyden — NO Adam
    # warmup. Adaptive collars q=0.9 clamped [0.05, 0.5] are the BASELINE;
    # cells 2-3 override to fixed sigma, cells 4-5 switch on the single
    # corrector. The lr key is inert (Adam-only); SSBroyden reads the
    # ssbroyden block. sigma_fraction is the fallback if sizing fails.
    fine_tune:
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.05
      adaptive_collar_size: false
      # Segment-scoped: applies to the fine-tune ONLY (flat key, read in
      # epoch_loop); the global sampling.collar_data_ratio stays 0.0 so
      # phase 3 keeps its proven uniform per-expert draw. THIS RUN: wide
      # collars (sigma 0.2) + heavy collar share (0.5) — testing the
      # wide-blend regime, aimed at windows 1-2 whose fresh experts may
      # carry real collar mismatch. Window 0 (reconciled handoff) is
      # expected to start WORSE under sigma 0.2 (measured: sigma 0.1
      # already 5x worse there); best-restore bounds its downside.
      collar_data_ratio: 0.5
      corrector_architecture: null
      corrector_init: zero
      epochs: 40000
      lr: 0.0001
      lr_schedule: none
      min_epochs: 1
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.2
      single_corrector: false
      # lr 1.0 = the proven 2nd-order ft recipe (2026-08-10; the damped 0.1
      # belonged to the wide-collar sigma-0.2 regime and is retired).
      ssbroyden:
        lr: 1.0
        tolerance_grad: 1.0e-10
    initial_train:
      # ROOT — SKIPPED in every cell (pretrained_local_expert_checkpoint is
      # set, which skips root AND phase 3; this block is ignored).
      epochs: 41000
      lr: 0.001
      lr_decay_rate: 0.98
      lr_decay_steps: 1000
      lr_schedule: none
      lr_warmup_steps: 0
      optimizer_1: adam
      optimizer_2: ssbroyden
      optimizer_switch_epoch: 1000
    max_experts: 150
    split_icbc:
      enabled: true
      # Cap on the interface derivative-matching order. null = N-1 (the
      # method default: KdV matches u,u_x,u_xx; KS adds u_xxx). 1 = value +
      # u_x only: 4 conditions per interior interface, >= the 3 KdV needs
      # and exactly the 4 KS needs, and it removes the worst-scaled term
      # (interface_bc_dxx started at ~1e5 in W1 vs dx ~8e2, value ~1).
      # Interface terms only; periodic pairing keeps full order.
      max_interface_derivative_order: null
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  # PHASE 3 budget: 10k Adam warmup + 40k SSBroyden (per window).
  epochs: 50000
  # The VERIFIED stopping rule: eval 1000 x patience 10 = a 10k window. The
  # adacollar recipe has a known plateau around epochs 10-15k before its
  # second descent — the 30-Jul verified run crossed it with 2 evals to
  # spare; the 2.5k triage window executed it mid-plateau.
  eval_every: 1000
  eval_only: false
  kdv:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 16
      tol_schedule:
      - 0.01
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 2.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 1000
    mu: 0.022
    new_norm_threshold: 0.2
    output_dim: 1
    # Window/segment resume: each key may point at a SEGMENT folder holding
    # window_{idx}_*.pt files (+ manifest). Per window, the LATEST stage
    # with a file wins: experts file -> start at fine-tune; else root file
    # -> start at phase 3; else train the window from scratch (soft miss).
    # Current folder: phase3/window_0, root/window_{0,1} => window 0 jumps
    # to fine-tune, window 1 to phase 3, window 2 runs the full flow.
    pretrained_base_checkpoint: roots_checkpoints/double_precision/kdv_no_resample-4-60-roots/root
    pretrained_local_expert_checkpoint: roots_checkpoints/double_precision/kdv_no_resample-4-60-roots/phase3
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 3
      # DEBUG: run only these window indices (contiguous, e.g. [1] or
      # [1, 2]); null = all windows. Skipped windows produce nothing; a
      # partial run skips the combined model / full-domain rel-L2 stages.
      debug_windows: null
      # IC source when debug_windows starts at window k>0: a checkpoint of
      # window k-1 whose prediction at t_start(k) becomes the IC. Accepts a
      # root checkpoint (best_model_root.pt, base-only forward) OR a full
      # AToE checkpoint (best_model_phase3/fine_tune.pt, soft-blend
      # forward). E.g. roots_checkpoints/double_precision/
      # kdv_no_resample-4-60-roots/root/window_0_best_model_root.pt
      last_window_checkpoint: null
    tree_smoothness_threshold: 0.4
    wavelet_threshold: 0.0025
    window_smoothness_order: 3
    window_type: smoothstep
  ks:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    alpha: 6.25
    beta: 0.390625
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 1.0
    gamma: 0.00152587890625
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 10.0
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - 0.0
      - 6.283185307179586
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
      # Same debug mechanism as kdv.time_marching (see comments there).
      debug_windows: null
      last_window_checkpoint: null
    tree_smoothness_threshold: 0.3
    wavelet_threshold: 0.04
    window_smoothness_order: 4
    window_type: smoothstep
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_schedule: none
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 0
  min_epochs: 1
  model: AToELeaves
  # Top-level keys govern PHASE 3: 10k Adam (fresh per-expert draws every
  # epoch via the Adam cadence rule) -> SSBroyden on a static draw.
  # Warmup extended 1k -> 10k for kdv: the interface derivative terms start
  # ~9 orders above the residual (u_xx ~ 1e3 at packet-crossing faces);
  # Adam's per-coordinate scaling is the one optimizer indifferent to that
  # spread, and it was still descending steeply at the old 1k switch
  # (6.4e6 -> 3.5e5); SSBroyden latched immediately after.
  optimizer_1: adam
  optimizer_2: ssbroyden
  optimizer_switch_epoch: 10000
  # 10 evals x eval_every 1000 = 10k epochs without a 1% improvement.
  # Bumped from 5 (2026-08-09): window_0 fine-tune best-stopped at epoch 4000
  # then early-stopped at 9000 mid-recovery from a dip; window_1 phase3
  # early-stopped at epoch 15000/50000 (only 30% of budget) while several
  # experts were still improving. Applies to root/phase3 directly (no
  # dedicated segment block) and to fine_tune's inherited default.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float64
  print_every: 1000
  problem: kdv
  profiling:
    enabled: false
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 20000
    plot_samples_every: 1000
    rad_pool_size: 100000
    rad_pool_chunk: 5000
    # NO periodic resampling (the 24-Jul regime): Adam warmups still redraw
    # every epoch via the cadence rule; SSBroyden phases are static.
    resample_every_epochs: 99999
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    wavelet_threshold: 0.1
    window_smoothness_order: 2
    window_type: smoothstep
  seed: 42
  soap:
    betas:
    - 0.95
    - 0.95
    precondition_frequency: 10
    weight_decay: 0.0
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: kdv_w012_experts_iface1
experiments:
# THREE PER-WINDOW EXPERT RUNS on the NEW tol14/ic100 roots (rel-L2:
# W0 9.97e-9, W1 9.40e-8, W2 2.99e-7). Phase 3 only (no fine-tune), static
# draws (no resampling), each window loads its own root and takes its IC
# from the PREVIOUS window's root checkpoint.
#
# THE tested mechanism: interface derivative matching capped at order 1
# (split_icbc.max_interface_derivative_order: 1 -> transmit u and u_x
# only, u_xx dropped). Condition count: 4 per interior interface — over
# the 3 KdV needs by one (consistent), exactly the 4 KS needs — and it
# removes the worst-scaled interface term (dxx started ~1e5 in W1 vs
# dx ~8e2, value ~1); with ic=100 the init loss terms are roughly
# balanced without any normalization machinery.
#
# Common recipe: 2k Adam + 40k SSBroyden (42000/2000), patience 5,
# tolerance_grad 1e-14, ic=100, experts 3x20, M=20 quadratic
# (W0 M=2 / W1 M=6 / W2 M=12), static draws, no fine-tune.
- name: kdv_w0_experts_iface1
  problem: kdv
  model: AToELeaves
  base_architecture: [2, 60, 60, 60, 60, 1]
  experts_architecture: [2, 20, 20, 20, 1]
  epochs: 42000
  optimizer_switch_epoch: 2000
  patience_evals: 5
  ssbroyden:
    tolerance_grad: 1.0e-14
  adaptive_pinn:
    split_icbc:
      max_interface_derivative_order: 1
    fine_tune:
      epochs: 0
  kdv:
    loss_weights:
      ic: 100.0
    pretrained_base_checkpoint: roots_checkpoints/double_precision/kdv_no_resample-4-60-roots_ic_100_tol14/root
    pretrained_local_expert_checkpoint: null
    time_marching:
      debug_windows: [0]

- name: kdv_w1_experts_iface1
  problem: kdv
  model: AToELeaves
  base_architecture: [2, 60, 60, 60, 60, 1]
  experts_architecture: [2, 20, 20, 20, 1]
  epochs: 42000
  optimizer_switch_epoch: 2000
  patience_evals: 5
  ssbroyden:
    tolerance_grad: 1.0e-14
  adaptive_pinn:
    split_icbc:
      max_interface_derivative_order: 1
    fine_tune:
      epochs: 0
  kdv:
    loss_weights:
      ic: 100.0
    pretrained_base_checkpoint: roots_checkpoints/double_precision/kdv_no_resample-4-60-roots_ic_100_tol14/root
    pretrained_local_expert_checkpoint: null
    time_marching:
      debug_windows: [1]
      # IC = previous window's NEW root (9.97e-9).
      last_window_checkpoint: roots_checkpoints/double_precision/kdv_no_resample-4-60-roots_ic_100_tol14/root/window_0_best_model_root.pt

- name: kdv_w2_experts_iface1
  problem: kdv
  model: AToELeaves
  base_architecture: [2, 60, 60, 60, 60, 1]
  experts_architecture: [2, 20, 20, 20, 1]
  epochs: 42000
  optimizer_switch_epoch: 2000
  patience_evals: 5
  ssbroyden:
    tolerance_grad: 1.0e-14
  adaptive_pinn:
    split_icbc:
      max_interface_derivative_order: 1
    fine_tune:
      epochs: 0
  kdv:
    loss_weights:
      ic: 100.0
    pretrained_base_checkpoint: roots_checkpoints/double_precision/kdv_no_resample-4-60-roots_ic_100_tol14/root
    pretrained_local_expert_checkpoint: null
    time_marching:
      debug_windows: [2]
      # IC = previous window's NEW root (9.40e-8).
      last_window_checkpoint: roots_checkpoints/double_precision/kdv_no_resample-4-60-roots_ic_100_tol14/root/window_1_best_model_root.pt
