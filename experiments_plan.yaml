# ==========================================================================
# KDV ROOT-ONLY 128x6, ADAM 30K -> LBFGS 30K, PERIODIC VS PLAIN FF
# (2026-08-17 v5): two runs. The 1k-Adam handoff was probe-diagnosed as
# too early (directional derivatives collapse to ~1e-5 one LBFGS step in
# — f64 crawls, fp32 freezes at ANY lr); the v3 sweep's best cell was
# the 50k-Adam handoff. 30k Adam is the middle; LBFGS gets 30k steps.
#   run 1 (periodic):   fourier periodic root_only — BC hard-enforced,
#     global-loss bc terms OFF (as in v2-v4).
#   run 2 (noperiodic): plain RFF (periodic false) — soft BC active:
#     FULL-order pairing u, u_x, u_xx (bc_max_derivative_order 2) at
#     weight 1000. (null is NOT safe in the global kdv loss — it reads
#     .get(key, 2), so an explicit null becomes None and crashes; 2 is
#     the equivalent explicit value.)
# Both: Adam lr 1e-3, 2k-step warmup (start factor 0.01), exp decay
# x0.9/2k steps (handoff LR ~2.3e-4); initial_train epochs 60000,
# switch 30000. LBFGS lr 0.1 (see lbfgs block comment), history 100,
# strong Wolfe, max_iter 1, freeze_stop 100.
#
# Sampling: batch_size 99999 >= pool -> Adam runs FULL-BATCH (all 20512
# points: 20k residual + 256 IC + 256 BC) with a FRESH draw every step
# (dp-recipe Adam regime), 1 step = 1 epoch; LBFGS = full static 20k
# pool swapped in at the switch. Root MLP 6x128, FF dim auto -> 64
# freqs -> 128-dim, scale 2.0. float32, seed 42, ic weight 1000, no
# phase 3 (epochs 0), no fine-tune, patience disabled. Dataset
# self-heal handles any stale cache. Carried inert for later phases:
# split_icbc max_interface_derivative_order null + normalization,
# tree M18 windowed structure-only W3 linear, experts 3x30.
# ==========================================================================
base_config:
  activation: tanh
  adam:
    betas: [0.9, 0.999]
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 20
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.05
      adaptive_collar_size: false
      collar_data_ratio: 0.5
      corrector_architecture: null
      corrector_init: zero
      epochs: 40000
      lr: 0.0001
      lr_schedule: none
      min_epochs: 1
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.2
      single_corrector: false
      ssbroyden: {lr: 1.0, tolerance_grad: 1.0e-14}
    initial_train: {epochs: 41000, lr: 0.001, lr_decay_rate: 0.98, lr_decay_steps: 1000, lr_schedule: none,
      lr_warmup_steps: 0, optimizer_1: adam, optimizer_2: ssbroyden, optimizer_switch_epoch: 1000}
    max_experts: 150
    split_icbc: {enabled: true, max_interface_derivative_order: null}
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling: {adaptive_ratio: 0.5, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1.0]
    expert_grad_clip_norm: null
    fourier_features: {dim: 10, enabled: false, periodic: false, scale: 3.0}
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 100}
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [-1.0, 1.0]
    temporal_domain: [0.0, 1.0]
    time_marching: {enabled: false, freeze_previous_windows: true, m_distribution: quadratic, num_windows: 5}
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  base_architecture: [2, 60, 60, 60, 60, 1]
  batch_size: 99999
  burgers1d:
    adaptive_sampling: {adaptive_ratio: 0.5, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1.0]
    expert_grad_clip_norm: null
    fourier_features: {dim: 128, enabled: false, periodic: false, scale: 1.0}
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 100}
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [-1.0, 1.0]
    temporal_domain: [0.0, 1.0]
    time_marching: {enabled: false, freeze_previous_windows: true, m_distribution: quadratic, num_windows: 5}
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  epochs: 50000
  eval_every: 1000
  eval_only: false
  experts_architecture: [2, 20, 20, 20, 1]
  freeze_stop_epochs: 5
  kdv:
    adaptive_sampling: {adaptive_ratio: 0.3, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 16
      tol_schedule: [0.01]
    expert_grad_clip_norm: null
    fourier_features: {dim: 10, enabled: false, periodic: false, scale: 2.0}
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 100.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 1000}
    mu: 0.022
    new_norm_threshold: 0.2
    output_dim: 1
    pretrained_base_checkpoint: roots_checkpoints/double_precision/kdv_no_resample-4-60-roots_ic_100_tol14/root
    pretrained_local_expert_checkpoint: roots_checkpoints/double_precision/kdv_no_resample-4-60-roots_ic_100_tol14/phase3
      _full_converge_till_flat
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [-1.0, 1.0]
    temporal_domain: [0.0, 1.0]
    time_marching:
      debug_windows: [1]
      enabled: true
      freeze_previous_windows: true
      last_window_checkpoint: roots_checkpoints/double_precision/kdv_no_resample-4-60-roots_ic_100_tol14/root/window_0_best_model_root.pt
      m_distribution: quadratic
      num_windows: 3
    tree_smoothness_threshold: 0.4
    wavelet_threshold: 0.0025
    window_smoothness_order: 3
    window_type: smoothstep
  ks:
    adaptive_sampling: {adaptive_ratio: 0.5, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    alpha: 6.25
    beta: 0.390625
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1]
    expert_grad_clip_norm: null
    fourier_features: {dim: 10, enabled: false, periodic: false, scale: 1.0}
    gamma: 0.00152587890625
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 100}
    new_norm_threshold: 10.0
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [0.0, 6.283185307179586]
    temporal_domain: [0.0, 0.5]
    time_marching: {debug_windows: null, enabled: true, freeze_previous_windows: true, last_window_checkpoint: null,
      m_distribution: quadratic, num_windows: 5}
    tree_smoothness_threshold: 0.3
    wavelet_threshold: 0.04
    window_smoothness_order: 4
    window_type: smoothstep
  # lbfgs lr 0.1 (not 1.0): torch's strong-Wolfe first trial is
  # t0 = lr*min(1, 1/|g|_1) ~ 1e-3 at this loss scale, which lands ON the
  # loss cliff (f blows up ~6x); whether the zoom recovers or collapses to
  # t=0 (permanent freeze — both colab runs) is draw-dependent. lr 0.1
  # puts t0 ~ 1e-4 inside the descent valley (probe-verified 2026-08-17).
  lbfgs: {history_size: 100, line_search: strong_wolfe, lr: 0.1, max_iter: 1, tolerance_change: 1.0e-14, tolerance_grad: 1.0e-14}
  lr: 0.001
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_schedule: none
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 0
  min_epochs: 1
  model: AToELeaves
  multi_optimizers: false
  optimizer_1: adam
  optimizer_2: ssbroyden
  optimizer_switch_epoch: 10000
  patience_evals: 5
  patience_rel_delta: 0.01
  precision: float64
  print_every: 1000
  problem: kdv
  profiling: {enabled: false}
  refresh_2nd_order_optimizer: false
  resume_from: null
  sampling: {collar_data_ratio: 0.0, collar_margin: 1.0, eval_train_ratio: 0.25, min_points_per_expert: 1024,
    n_boundary_train: 256, n_initial_train: 256, n_residual_train: 20000, plot_samples_every: 5000, rad_pool_chunk: 5000,
    rad_pool_size: 100000, resample_every_epochs: 99999, sample_volume_ratio: 35}
  save_every: 999999
  schrodinger:
    adaptive_sampling: {adaptive_ratio: 0.5, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1.0]
    expert_grad_clip_norm: null
    fourier_features: {dim: 128, enabled: false, periodic: false, scale: 1.0}
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 100}
    new_norm_threshold: 2.0
    output_dim: 2
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [-5.0, 5.0]
    temporal_domain: [0.0, 1.5707963267948966]
    time_marching: {enabled: false, freeze_previous_windows: true, m_distribution: quadratic, num_windows: 5}
    tree_smoothness_threshold: 0.7
    wavelet_threshold: 0.1
    window_smoothness_order: 2
    window_type: smoothstep
  seed: 42
  soap:
    betas: [0.95, 0.95]
    precondition_frequency: 10
    weight_decay: 0.0
  ssbroyden: {lr: 1.0, tolerance_grad: 1.0e-10}
