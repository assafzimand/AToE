# ==========================================================================
# KDV LBFGS FINE-TUNES ft3 — SIGMA / COLLAR / LR GRID ON THE TWO WORKING
# OPTIMIZER MODES (2026-08-22). Root + A1 experts LOADED (straight to ft).
# ft2 VERDICT (commented below): joint-ft loss and rel-L2 are DECOUPLED at
# sigma 0.1 — SW lr 1e-3 (loss /44) and fixed-step 1e-2 (loss /223) both
# left rel at/below-start; Adam degrades rel monotonically (1e-3 destroys
# in 1 epoch: residual 1.6e8, rel 0.33). Loss is ~100% seam residual
# (ic/bc ~1e-7). This grid tests whether SIGMA (seam geometry = the
# objective itself) changes that alignment, plus collar 0.5 probes and
# lr band mapping:
#   Block 1: sigma {0.05, 0.2, 0.3} x {SW lr 1e-3, FS lr 1e-2}, collar 0
#            (sigma 0.1 baselines = ft2 075517 / 082752).
#   Block 2: collar 0.5 x sigma {0.05, 0.1, 0.2}, FS lr 1e-2 (no freeze).
#   Block 3: lr map at sigma 0.1 col 0 — SW {5e-4, 5e-3},
#            FS {5e-3, 5e-2, 5e-1 (expected divergence)}.
# All cells: 30k ft epochs, eval_every 500 (patience 10 evals = 5k-epoch
# window), freeze_stop 100, bc order 1 + both normalizations, static 20k
# pool, batch 99999, float32. SW = strong_wolfe line search, FS = fixed
# step (line_search null). READ-OUT: any rel-L2 improvement >1% below
# 5.39e-2 revives joint ft at that sigma; 14/14 flat-or-worse => corrector
# (single_corrector) / L2-SP anchored ft next.
# ==========================================================================
base_config:
