# ══════════════════════════════════════════════════════════════════════════
# RESULTS RUN — FULL FLOW, UNIFORM SCHEME: 5k Adam warmup + 40k SSBroyden
# in every segment, all 3 PDEs from scratch.
# ══════════════════════════════════════════════════════════════════════════
#
# THE RECIPE (one scheme at every level, deviations only where principled):
#   every segment    5,000 Adam epochs -> 40,000 SSBroyden (budget 45,000),
#                    full batch, float64, 20k residual + 256 IC + 256 BC.
#   root             Adam lr 1e-3; RAD 0.5 re-targeted every 500.
#   phase 3          Adam lr 1e-3 (fresh per-expert draws every epoch under
#                    Adam), then SSBroyden on a STATIC draw (code-enforced in
#                    trainer/epoch_loop.py). RAD force-disabled in code: the
#                    decomposition already did the spatial adaptation, the
#                    per-expert mean makes cross-leaf targeting moot, and
#                    periodic redraws under the quasi-Newton were shown to
#                    cause a memorization sawtooth (see below).
#   fine-tune        Adam lr 1e-4 (gentle handoff), then SSBroyden; adaptive
#                    collars from the root (q=0.9, clamp [0.03, 0.5]);
#                    RAD 0.5 re-targeted every 500.
#
# EVIDENCE BEHIND EACH CHOICE (burgers A/B chain, all on the same root/tree):
#   * redraws-500 + cold SSBroyden:  phase 3 stalls 8.5e-6; on/off-draw
#     memorization gap 50-250x; experts explode out-of-box (norms to 1819);
#     fine-tune handoff destroyed (rel-L2 3.99 -> stuck 0.25).
#   * static + cold SSBroyden:       3.5e-6, then a hard freeze at 16.5k
#     (scimba tolerance_grad latch on a static objective).
#   * static + Adam warmup:          phase 3 1.89e-7 (full budget, best at
#     39k, no freeze), fine-tune 7.22e-8 — first full working chain, matching
#     the 30-Jul verified fine-tune (6.98e-8). Warmup selects a flat basin
#     (same 3e-9-scale train loss as cold, 15x better rel-L2).
#   * allen_cahn redraw cell (7.2e-6) does NOT contradict: its sawtooth was
#     x42-x7518, masked by a weak root (1.5e-4) capping expert quality first;
#     its fine-tune still degraded 7x.
#   Warmup at 5k (vs the proven 1k) is insurance: Adam plateaus early, extra
#   epochs idle harmlessly; budgets were raised 40k->45k so SSBroyden keeps
#   its full 40k. Fine-tune warmup is the one unverified piece (converged
#   experts, no basin to select) — accepted; a no-warmup fine-tune control
#   can be re-run cheaply from the saved phase-3 checkpoints.
#
# ORDER: schrodinger FIRST as the OOM canary (largest graph, most leaves;
# the memory peak lands at the first SSBroyden Hessian update in the root —
# a crash shows in the first minutes, not hours in). Root [2, 64x5, out]
# = 16,897 params -> Hessian peak ~13.7 GB of the A10G's 24 GB. WATCH THE
# LEAF COUNT in the schrodinger log; >15 leaves => raise wavelet_threshold.
# Recommended on the box:
#     export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#
# WHAT TO CHECK PER PDE:
#   * root vs previous cold roots (burgers 8.9e-9, schrod 2.4e-4, ac 1.5e-4)
#   * phase 3: burgers should land ~2e-7; allen_cahn must beat its redraw
#     cell's 7.2e-6; watch the expert norm/psi dump at fine-tune start
#     (healthy: norms O(10), std O(1); monsters: 100+).
#   * fine-tune must IMPROVE on its phase-3 start (burgers proved 2.6x).
#
# This is the DEFAULT plan: `python run_experiments.py` reads it as-is;
# AWS_scripts/run_and_terminate.sh launches it and stops the box after.
# Previous plans archived under experiment_plans/.
# ══════════════════════════════════════════════════════════════════════════
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    # FINE-TUNE: 5k Adam (lr 1e-4 — gentle on converged experts) -> 40k
    # SSBroyden. Adaptive collars sized from the root at q=0.9 clamped
    # [0.03, 0.5]; RAD 0.5 via the per-PDE adaptive_sampling blocks, redraw
    # + re-target every sampling.resample_every_epochs (500). Same as the
    # 30-Jul-verified recipe plus the uniform warmup; sigma_fraction is the
    # fallback if collar sizing fails.
    fine_tune:
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.03
      adaptive_collar_size: true
      corrector_architecture: null
      corrector_init: zero
      epochs: 45000
      lr: 0.0001
      lr_schedule: none
      min_epochs: 1
      optimizer_1: adam
      optimizer_2: ssbroyden
      optimizer_switch_epoch: 5000
      sigma_fraction: 0.05
      single_corrector: false
    initial_train:
      # ROOT: 5k Adam (lr 1e-3) -> 40k SSBroyden, RAD 0.5 every 500.
      epochs: 45000
      lr: 0.001
      lr_decay_rate: 0.98
      lr_decay_steps: 1000
      lr_schedule: none
      lr_warmup_steps: 0
      optimizer_1: adam
      optimizer_2: ssbroyden
      optimizer_switch_epoch: 5000
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    # Drives the leaf count. A better root produces smaller detail
    # coefficients, so this should yield the same or FEWER leaves than the
    # 7 the 60x4 root gave. Raise it if a run reports more than ~15.
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    # 6 leaves off the 60x4 root. See the allen_cahn note above.
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  # PHASE 3 budget (the top-level `epochs` key is the phase-3 segment):
  # 5k Adam warmup + 40k SSBroyden.
  epochs: 45000
  eval_every: 1000
  eval_only: false
  kdv:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 16
      tol_schedule:
      - 0.01
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 2.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 1000
    mu: 0.022
    new_norm_threshold: 0.2
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 3
    tree_smoothness_threshold: 0.4
    wavelet_threshold: 0.0025
    window_smoothness_order: 3
    window_type: smoothstep
  ks:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    alpha: 6.25
    beta: 0.390625
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 1.0
    gamma: 0.00152587890625
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 10.0
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - 0.0
      - 6.283185307179586
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.3
    wavelet_threshold: 0.04
    window_smoothness_order: 4
    window_type: smoothstep
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_schedule: none
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 0
  min_epochs: 1
  model: AToELeaves
  # These top-level keys are the PHASE 3 segment's optimizer (orchestrator
  # passes cfg itself as phase 3's segment config): 5k Adam (lr 0.001,
  # per-epoch fresh draws via the Adam cadence rule) -> SSBroyden on a
  # STATIC draw (code-enforced). Patience resets at the switch, so
  # SSBroyden gets a fresh grace window.
  optimizer_1: adam
  optimizer_2: ssbroyden
  optimizer_switch_epoch: 5000
  # 10 evals x eval_every 1000 = 10k epochs without a 1% improvement.
  # Applies PER SEGMENT, including the root.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float64
  print_every: 1000
  problem: schrodinger
  profiling:
    enabled: false
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    # Floor on residual points per leaf in phase 3. The per-expert draw sizes
    # each leaf by volume (n_e = N * vol_e / vol_domain), so a thin leaf
    # around a sharp feature would otherwise be starved and stop training.
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 20000
    plot_samples_every: 1000
    # RAD candidate pool, redrawn uniformly every resample_every_epochs.
    # 100k against a 10k adaptive draw (n_residual_train x adaptive_ratio)
    # also puts the sampler on its without-replacement path (pool >= 4x draw).
    rad_pool_size: 100000
    # Below the 20000 default: the pool probe is a forward with 2nd
    # derivatives in float64, and in the fine-tune it runs over every leaf.
    # Chunks are independent, so this is numerically identical.
    rad_pool_chunk: 5000
    # SSBroyden honours this directly (the every-epoch override is Adam/SOAP
    # only), so both the collocation redraw and the RAD re-target happen here.
    # Applies to the ROOT and FINE-TUNE; phase 3 is static under SSBroyden
    # (code-enforced in trainer/epoch_loop.py).
    resample_every_epochs: 500
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    # 10 leaves off the 60x4 root -- the highest of the three, and the one to
    # watch. 15 leaves would be 9.6 GB in phase 3, 20 would be 17.0 GB.
    wavelet_threshold: 0.1
    window_smoothness_order: 2
    window_type: smoothstep
  seed: 42
  soap:
    betas:
    - 0.95
    - 0.95
    precondition_frequency: 10
    weight_decay: 0.0
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: full_flow_warmup5k
experiments:
# Root [2, 64x5, out] = 16,897 params (16,962 for schrodinger) -> SSBroyden
# Hessian peak ~13.7 GB of the A10G's 24 GB. Experts [2, 20x3, out].
# SCHRODINGER FIRST: same root size, largest graph, most leaves — an OOM
# surfaces at the first Hessian update, minutes in.
- name: schrodinger_full_flow
  problem: schrodinger
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 2]
  experts_architecture: [2, 20, 20, 20, 2]
- name: burgers1d_full_flow
  problem: burgers1d
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_full_flow
  problem: allen_cahn
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 1]
  experts_architecture: [2, 20, 20, 20, 1]
