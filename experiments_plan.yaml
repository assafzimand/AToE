    resample_every_epochs: 99999
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
