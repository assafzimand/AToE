# ==========================================================================
# AC / BURGERS / SCHRODINGER — 24-WIDE EXPERTS, CURRENT-CODE ARM (2026-08-23)
# Paper-run replica of ac_burgers_schrodinger_experts_creation_20260724_142507
# (experts @ commit 0894149, fine-tunes @ 8424579) on CURRENT code, with
# experts 2-24-24-24-1/2 instead of 2-20-20-20-1/2. Roots are LOADED from the
# paper run (roots_checkpoints/double_precision/no_resample-4-60-roots) —
# Phase 1 is skipped; each run does tree -> phase 3 (41k, adam->ssbroyden
# @1000) -> joint fine-tune (40k ssbroyden, sigma 0.05, collar 0.3) in one
# session. best_model_phase3.pt and best_model_fine_tune.pt are both saved.
# Faithful-to-paper settings: float64, seed 42, full batch (99999), no
# resample (99999), no RAD/LRA/RWF/FF/causal, split_icbc with OLD loss
# semantics spelled out (max_interface_derivative_order null = full order,
# no interface/bc normalization, no order decay, bc_max_derivative_order
# null), ssbroyden lr 1.0 tol 1e-10 both segments, patience 5 x eval 1000,
# no freeze-stop. sigma_fraction 0.05 (single knob now; verified 2026-08-23:
# phase 3 trains+evals with HARD indicators and collar sampling is off at
# collar_data_ratio 0, so sigma only shapes the fine-tune soft PoU — paper's
# creation-time 0.03 had no effect on phase 3 either).
# DELIBERATE current-code deltas vs the paper run (accepted 2026-08-23):
#   - tree fit on the solver's NATIVE grid (no knob; cuts/regions may differ
#     from the paper decomposition), tree_min_samples_leaf 50 literal;
#   - datasets regenerate in true float64 (paper targets carried float32
#     rounding) — DELETE stale datasets/*/training_data.pt on reused machines;
#   - phase-3 residuals drawn per-expert directly, with a 4096-point floor
#     (min_points_per_expert 4096 — chosen 2026-08-23, paper had no floor);
#   - fine_tune.collar_data_ratio 0.3 overrides the global 0.0 for the ft
#     segment only (replicates the paper's two-config collar split).
# Old-commit arm runs separately from the 0894149/8424579 worktrees.
# (Previous KdV ft4 grid plan: see git history of this file.)
# ==========================================================================
