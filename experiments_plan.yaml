# ==========================================================================
# KS f32 SOAP FOLLOW-UP — A: w0 WITHOUT PERIODIC EMBEDDING (soft BC),
# B: w1 FROM THE CLEAN-SOAP w0 CHECKPOINTS
# (2026-09-12, main). CONTEXT: ext grid v3 = SOAP breakthrough — all 4
# SOAP w0 cells 5.4-9.7e-6 with FLAT in-window profile (x1.1 vs x13-20
# under LBFGS); clean cells: ext005 7.25e-6 (END 1.01e-5), ext010
# 9.18e-6 (END 8.11e-6). Recipe: pure SOAP 90k (betas .95/.95, precond
# 10), lr 1e-3 warmup2000 + exp 0.9/2000, 20k residual resampled every
# epoch, f32, patience 30.
# ACTIVE 4 cells:
#   A1/A2 = ext005/ext010 clean-SOAP w0 rerun with fourier periodic:
#     FALSE (plain RFF) -> global BC LOSS TERM active (weight 1e3,
#     bc order 1). Isolates the hard-BC embedding's contribution.
#   B1/B2 = w1-debug (t [0.1, 0.2]) from the staged clean-SOAP w0
#     ckpts (ext005 MD5 22f8fa40.., ext010 MD5 7dd061a0..), identical
#     config to their w0 (periodic root_only, NO causal, same delta).
#     w1 inherits END-slice ~1.0e-5 / 8.1e-6 (100x below the old
#     LBFGS handoff 6.7e-4). Old w1 floor: 3.0e-3.
# ON HOLD/RUNNING: KS f64 pair cell B (never ran); full 5w SOAP chain
# (queued — after B validates the handoff).
# ==========================================================================
base_config:
  activation: tanh
  adam:
    betas: [0.9, 0.999]
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
