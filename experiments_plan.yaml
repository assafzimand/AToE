# ==========================================================================
# KDV W1/W2 PHASE-3 BUDGET EXTENSION (Colab): exact twins of the 052432
# benchmark runs except epochs 42000 -> 80000 (2k Adam + 78k SSBroyden).
# Question: both windows hit the 42k budget MID-DESCENT (loss still
# shrinking x0.83-0.84 per 1k epochs, decelerating from x0.71-0.74) -
# where do they actually stop?
#
# Benchmark finals (42k):  W1 loss 8.859e-11 / rel-L2 1.177e-6
#                          W2 loss 8.702e-10 / rel-L2 2.842e-6
# Root-parity targets:     W1 loss 2.66e-13 / rel-L2 9.40e-8  (334x away)
#                          W2 loss 2.46e-12 / rel-L2 2.99e-7  (354x away)
# At the last-6k rate that is ~31-33k more epochs; the rate is decaying,
# so 80k total may or may not reach parity - either outcome answers the
# budget question. Patience 5 (eval 1000, >1%) stops a freeze/wall early;
# late-phase improvement is ~8%/eval, well above the 1% bar.
# Also watch: W1's laggards are the BOUNDARY PAIR e0/e1 (3.6/2.4e-11 vs
# interior ~2e-12) - a different laggard pattern than W0's e2.
#
# Setup notes: per-run pretrained_local_expert_checkpoint: null clears
# the base's phase3 pointer (else phase 3 would be SKIPPED); each window
# loads its own tol14 root and takes its IC from the previous window's
# root. Static draws, no RAD, no refresh, single joint optimizer,
# fine_tune epochs 0. Cost estimate (A100 pace): W1 ~5.5h, W2 ~8h.
# ==========================================================================
base_config:
  activation: tanh
  adam:
    betas: [0.9, 0.999]
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 20
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.05
      adaptive_collar_size: false
      collar_data_ratio: 0.5
      corrector_architecture: null
      corrector_init: zero
      epochs: 40000
      lr: 0.0001
      lr_schedule: none
      min_epochs: 1
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.2
      single_corrector: false
      ssbroyden: {lr: 1.0, tolerance_grad: 1.0e-14}
    initial_train: {epochs: 41000, lr: 0.001, lr_decay_rate: 0.98, lr_decay_steps: 1000, lr_schedule: none,
      lr_warmup_steps: 0, optimizer_1: adam, optimizer_2: ssbroyden, optimizer_switch_epoch: 1000}
    max_experts: 150
    split_icbc: {enabled: true, max_interface_derivative_order: 1}
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling: {adaptive_ratio: 0.5, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule: [0.01, 0.1, 1.0]
    expert_grad_clip_norm: null
    fourier_features: {dim: 10, enabled: false, periodic: false, scale: 3.0}
    grad_clip_norm: null
    init: {hidden: default, ls_use_bias: false, output: default}
    loss_weights: {bc: 1.0, continuity: 0.0, ic: 1.0, residual: 1.0}
    lra: {alpha: 0.1, enabled: false, epsilon: 1.0e-05, scheme: grad_norm, update_every: 100}
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf: {enabled: false, mean: 1.0, std: 0.1}
    spatial_dim: 1
    spatial_domain:
    - [-1.0, 1.0]
    temporal_domain: [0.0, 1.0]
    time_marching: {enabled: false, freeze_previous_windows: true, m_distribution: quadratic, num_windows: 5}
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  base_architecture: [2, 60, 60, 60, 60, 1]
  batch_size: 99999
  burgers1d:
    adaptive_sampling: {adaptive_ratio: 0.5, enabled: false, phi: quadratic, phi_epsilon: 1.0, phi_power: 2.0}
    causal_training:
