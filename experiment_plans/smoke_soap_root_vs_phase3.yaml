# Smoke test for the SOAP root-vs-phase3 plan. Structure only, not accuracy.
#
# Mirrors experiment_plans/soap_100k_root_vs_phase3.yaml but with tiny
# architectures, 512 residual points and 5 epochs per segment, so all six
# flows execute end to end in minutes on CPU.
#
# What it is meant to prove:
#   * the A-variant really skips phase 3 (epochs: 0) and still spawns the
#     decomposition, then fine-tunes the composition
#   * the B-variant still runs root -> phase 3 -> fine-tune
#   * min_points_per_expert tops up starved experts (floor 128 against a
#     512-point global draw, so it must fire)
#   * SOAP + float32 + smoothstep C^4 + sigma_fraction 0.03 all work
#   * output_dim 2 (schrodinger) works alongside the scalar problems
#
# Warmup/decay are set to 2 steps so both scheduler branches are exercised
# within the 5-epoch budget.
#
# Run:  python run_experiments.py experiment_plans/smoke_soap_root_vs_phase3.yaml
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  soap:
    betas:
    - 0.9
    - 0.999
    precondition_frequency: 2
    weight_decay: 0.0
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 4
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      corrector_architecture: null
      corrector_init: zero
      single_corrector: false
      epochs: 5
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 2
      lr_decay_rate: 0.9
      lr_decay_steps: 2
      min_epochs: 1
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.03
      adaptive_collar_size: false
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_min: 0.02
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_grid: 65
    initial_train:
      epochs: 5
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 2
      lr_decay_rate: 0.9
      lr_decay_steps: 2
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 10
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 4
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 4
    window_type: smoothstep
  cuda: false
  epochs: 5
  eval_every: 1
  eval_only: false
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.9
  lr_decay_steps: 2
  lr_schedule: exponential
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 2
  min_epochs: 1
  model: AToELeaves
  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 99999
  patience_evals: 99999
  patience_rel_delta: 0.01
  precision: float32
  print_every: 1
  # Tiny window so the profiler is exercised inside the 5-epoch segments.
  profiling:
    enabled: true
    segments: all
    start_epoch: 1
    warmup: 1
    active: 2
    top_k: 10
    record_shapes: false
    emit_trace: false
  problem: burgers1d
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    min_points_per_expert: 128
    n_boundary_train: 32
    n_initial_train: 32
    n_residual_train: 512
    plot_samples_every: 0
    resample_every_epochs: 1
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    wavelet_threshold: 0.1
    window_smoothness_order: 4
    window_type: smoothstep
  seed: 42
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: smoke_soap_root_vs_phase3
experiments:
# ── A: root -> fine_tune (phase 3 skipped) ──
- name: burgers1d_A_root_finetune
  problem: burgers1d
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 20, 20, 1]
  experts_architecture: [2, 8, 1]
- name: allen_cahn_A_root_finetune
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 20, 20, 1]
  experts_architecture: [2, 8, 1]
- name: schrodinger_A_root_finetune
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 20, 20, 2]
  experts_architecture: [2, 8, 2]
# ── B: root -> phase 3 -> fine_tune ──
- name: burgers1d_B_phase3_finetune
  problem: burgers1d
  model: AToELeaves
  epochs: 5
  base_architecture: [2, 20, 20, 1]
  experts_architecture: [2, 8, 1]
- name: allen_cahn_B_phase3_finetune
  problem: allen_cahn
  model: AToELeaves
  epochs: 5
  base_architecture: [2, 20, 20, 1]
  experts_architecture: [2, 8, 1]
- name: schrodinger_B_phase3_finetune
  problem: schrodinger
  model: AToELeaves
  epochs: 5
  base_architecture: [2, 20, 20, 2]
  experts_architecture: [2, 8, 2]
