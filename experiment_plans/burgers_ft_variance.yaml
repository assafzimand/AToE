    leaf_input_normalization: false
    max_experts: 150
    split_icbc: {bc_term_normalization: false, enabled: true, global_bc_or_root_mounted: root_mounted,
      interface_order_decay: 1.0, interface_term_normalization: false, max_interface_derivative_order: null}
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
