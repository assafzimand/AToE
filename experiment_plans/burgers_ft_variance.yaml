# Fine-tune-only variance study (2026-10-23). Same fine-tune config as the
# second_order_fullflow_3seeds plan (40k SSBroyden, sigma 0.03, collar 0.3, lr 1e-4,
# patience off, plot 0). epochs: 0 => root + phase 3 skipped, fine-tune only.
#  refexperts : the paper's experts (Aug-23 phase 3, 'global' BC mode) -> paper ft got 1.30e-8
#  s42experts : seed-42 phase-3 best of the Oct-22 full-flow batch (root_mounted) -> ft got 3.70e-8
# Only the draw seed changes between the 3 cells of a group.
experiment_name: burgers_ft_variance_refexperts_vs_s42experts
base_config:
  activation: tanh
  adam:
    betas: [0.9, 0.999]
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune: {adaptive_collar_grid: 257, adaptive_collar_quantile: 0.9, adaptive_collar_sigma_max: 0.5,
      adaptive_collar_sigma_min: 0.05, adaptive_collar_size: false, collar_data_ratio: 0.3,
