# Fine-tune from the phase-3 experts: collar geometry sweep. Nine runs,
# 3 PDEs x 3 settings, 30k epochs each. Root and phase 3 are both SKIPPED --
# every run loads roots_checkpoints/single_precision/adaptive_sampling/
# <pde>_experts.pt and trains the joint PoU composition only.
#
#   A  <pde>_A_sigma003      sigma_fraction 0.03   (fixed collar, as trained)
#   B  <pde>_B_sigma02       sigma_fraction 0.2    (fixed collar, wide)
#   C  <pde>_C_adaptive      adaptive_collar_size, q 0.9, sigma in [0.1, 0.5]
#
# All three: adaptive sampling 0.5 (RAD, re-target every 1000), no corrector,
# no collar data.
#
# WHERE EACH TRACK STARTS, measured on the checkpoints with NO training --
# soft-blend rel-L2 against the hard-blend value the checkpoint was selected on:
#
#                 hard        A (s=.03)      B (s=.2)       C (adaptive)
#   burgers1d   5.308e-03   7.119e-03 1.3x  2.439e-01 46x  1.313e-01 24.7x
#   allen_cahn  2.057e-02   2.043e-02 1.0x  9.729e-02 4.7x 2.616e-02  1.3x
#   schrodinger 8.065e-04   8.040e-04 1.0x  1.027e-03 1.3x 1.331e-02 16.5x
#
# So A starts at parity everywhere, while B and C start in a hole on burgers
# (46x / 25x) and C on schrodinger (16.5x). That is not a reason to skip them
# -- a wider collar may be easier to TRAIN even though it starts worse, which
# is the whole hypothesis -- but B and C have to climb back to A's starting
# point before they are ahead of doing nothing. Judge them against the numbers
# above, not against each other's finals.
#
# On C's floor: adaptive_collar_sigma_min is 0.03, matching the width phase 3
# was trained against, so the scan can narrow back to the trained geometry
# where the field is quiet and widen only where a face cuts a feature. The
# clamp barely moves the starting point either way (burgers 22.1x hard at 0.03
# vs 24.7x at 0.1; schrodinger 16.15x vs 16.50x) -- C's cost comes from the
# faces the scan CHOOSES to widen, not from the floor.
#
# Note the fine-tune has consistently regressed from its first eval in every
# previous campaign, and fine_tune.min_epochs is 10000, so a track that is
# simply going to degrade will stop at 10k rather than burn all 30k.
#
# Budget: 9 x 30k = 270k.
#
# This is the DEFAULT plan: `python run_experiments.py` with no argument reads
# experiments_plan.yaml, so AWS_scripts/run_and_terminate.sh launches it as-is.
# A copy is kept at experiment_plans/soap_collar_geometry_sweep.yaml.
#
# Run:  python run_experiments.py
#   or: bash AWS_scripts/run_and_terminate.sh      (runs, then stops the box)
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  soap:
    # Released jaxpi SOAP config (examples/*/configs/*soap.py), which is the
    # artifact behind the published PINN numbers. The paper text instead
    # recommends beta1=0.99 from its ablation -- worth a later sweep.
    betas:
    - 0.9
    - 0.999
    # EMA decay of the Shampoo preconditioner. Upstream's -1 sentinel reuses
    # betas[1], which would silently stretch the preconditioner's memory to
    # 0.999 (~1000 steps) purely as a side effect of the beta2 above. The SOAP
    # paper runs betas (0.95, 0.95), i.e. a 0.95 preconditioner EMA, so pin it
    # there and let beta2 govern Adam's second moment alone.
    shampoo_beta: 0.95
    precondition_frequency: 2
    weight_decay: 0.0
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      corrector_architecture: null
      corrector_init: zero
      single_corrector: false
      # 0 = ROOTS-ONLY campaign. The tree is still built and the leaves are
      # still spawned (free diagnostics), but no expert is trained.
      epochs: 0
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 5000
      lr_decay_rate: 0.9
      # 5000, not the 2000 used by root/phase-3. The jaxpi schedule is built
      # for a segment that converges early (the paper reports SOAP reaching
      # ~1e-4 within 10k iterations) and then polishes; decay every 2000 over
      # 100k is 47 decays, ending at ~7e-6. The previous run confirmed that is
      # too aggressive HERE: allen_cahn's fine-tune spent its last 60k epochs
      # below 1.7e-4 and was still improving (rel-L2 0.465 -> 0.315) when the
      # budget ran out. 5000 gives 19 decays, ending at ~1.4e-4, and is the
      # value jaxpi's own allen_cahn/configs/soap.py uses.
      lr_decay_steps: 5000
      # Grace period before the plateau test can fire. Covers the 5k-step
      # warmup plus 5k of decay, so a noisy/flat rel-L2 during the LR ramp
      # cannot early-stop the segment. Fine-tune reads this key; root and
      # phase 3 read the top-level min_epochs instead.
      min_epochs: 10000
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.03
      adaptive_collar_size: false
      adaptive_collar_quantile: 0.9
      # 0.03: the floor now matches the width phase 3 was trained against, so
      # the gradient scan can NARROW back to the trained geometry wherever the
      # field is quiet and widen only at the faces that cut a feature. The old
      # 0.1 floor was set when 0.03 was the failing width; on these checkpoints
      # 0.03 is the healthy one (soft rel-L2 at parity with hard on all three
      # PDEs), so forcing every face to at least 0.1 only added cost.
      # Measured, no training: the floor is nearly irrelevant either way --
      # burgers 22.1x hard at 0.03 vs 24.7x at 0.1, schrodinger 16.15x vs
      # 16.50x. Whatever C costs comes from the faces the scan CHOOSES to
      # widen, not from the clamp.
      adaptive_collar_sigma_min: 0.03
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_grid: 257
      # Corrector knobs (single_corrector: true). freeze_experts=false trains
      # the leaf experts jointly with c, so the interiors are NOT protected;
      # corrector_collar_ratio must then stay well below its 1.0 default or the
      # interiors would be starved of residual points and drift.
      freeze_experts: true
      corrector_collar_ratio: 1.0
    initial_train:
      epochs: 100000
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 5000
      lr_decay_rate: 0.9
      lr_decay_steps: 2000
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      # RAD weighting from Wu et al. (CMAME 2023), the reference the SOAP-PINN
      # paper cites: err = |r|^k / mean(|r|^k) + c, with k = phi_power and
      # c = phi_epsilon. The mean-normalisation makes the weights scale-free
      # as the residual shrinks by orders of magnitude, and the +c floor keeps
      # every region at nonzero probability. The previous 'quadratic' had
      # neither: on a spiky field it spans ~1e10 in probability, so a region
      # that goes quiet is abandoned and never revisited.
      phi: rad
      phi_epsilon: 1.0
      phi_power: 1.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    # RAD root, rel-L2 1.442e-02 @ ep100000. Root is SKIPPED in both tracks.
    pretrained_base_checkpoint: roots_checkpoints/single_precision/adaptive_sampling/allen_cahn_root.pt
    # Phase-3 experts (7 leaves, 3x20), hard rel-L2 2.057e-02 @ ep100000.
    # Set for EVERY run this campaign, so root and phase 3 are both
    # skipped and pretrained_base_checkpoint above is ignored
    # (the orchestrator logs that) -- the expert checkpoint already
    # carries the base weights.
    pretrained_local_expert_checkpoint: roots_checkpoints/single_precision/adaptive_sampling/allen_cahn_experts.pt
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      # RAD weighting from Wu et al. (CMAME 2023), the reference the SOAP-PINN
      # paper cites: err = |r|^k / mean(|r|^k) + c, with k = phi_power and
      # c = phi_epsilon. The mean-normalisation makes the weights scale-free
      # as the residual shrinks by orders of magnitude, and the +c floor keeps
      # every region at nonzero probability. The previous 'quadratic' had
      # neither: on a spiky field it spans ~1e10 in probability, so a region
      # that goes quiet is abandoned and never revisited.
      phi: rad
      phi_epsilon: 1.0
      phi_power: 1.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    # RAD root, rel-L2 3.672e-05 @ ep64000. Root is SKIPPED in both tracks.
    pretrained_base_checkpoint: roots_checkpoints/single_precision/adaptive_sampling/burgers_root.pt
    # Phase-3 experts (6 leaves, 3x20), hard rel-L2 5.308e-03 @ ep85000.
    # Set for EVERY run this campaign, so root and phase 3 are both
    # skipped and pretrained_base_checkpoint above is ignored
    # (the orchestrator logs that) -- the expert checkpoint already
    # carries the base weights.
    pretrained_local_expert_checkpoint: roots_checkpoints/single_precision/adaptive_sampling/burgers_experts.pt
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  epochs: 100000
  eval_every: 1000
  eval_only: false
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.9
  lr_decay_steps: 2000
  lr_schedule: exponential
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 5000
  # Applies to the root and phase-3 segments (fine_tune has its own key).
  # 30000, up from 10000. Schrodinger's root is bistable: in the campaign that
  # worked it sat at rel-L2 ~1.0 through epoch 2000 and only broke through at
  # 3000, and in the campaign that failed it never broke through and
  # patience_evals=10 killed it at 11000 with rel-L2 0.92. A 10k floor gives a
  # bistable problem 11 evals to escape, which is a coin flip. Burgers stopped
  # at 35k last time, so this floor is nearly free for the others.
  min_epochs: 30000
  model: AToELeaves
  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 99999
  # Stop a segment after 10 consecutive evals (= 10k epochs at eval_every
  # 1000) without a >1% rel-L2 improvement over the patience-local best.
  # The counter resets on any qualifying improvement, so this is "10k epochs
  # since the last real gain", not a wall-clock cap.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float32
  print_every: 1000
  # Bounded torch.profiler window per segment, written to
  # <run_dir>/profile_<segment>.txt. Observer only: no RNG or tensor math is
  # touched, so results are bit-identical with it on or off, and any profiler
  # error disables itself and lets training continue. 55 of 100k epochs are
  # recorded, so the cost is seconds. Read the PERCENTAGES in the report --
  # absolute times inside a profiled window are inflated by the profiler.
  profiling:
    # OFF. The previous run's schrodinger job was SIGKILLed (exit -9, the OOM
    # killer) with its last log line being the fine-tune profiler opening its
    # window; the two jobs that survived closed the same window in ~2 minutes.
    # Its fine-tune window is the heaviest of the three (10 experts in a Python
    # forward loop, 80 parameter tensors through SOAP). A SIGKILL cannot be
    # caught, so the fail-safe wrapping in trainer/profiling.py is no help --
    # the only guard is to not open the window. The profiling questions are
    # answered; turn this back on deliberately when there is a new one.
    enabled: false
    segments: all
    start_epoch: 2000
    warmup: 5
    active: 50
    # 100 rather than 30: at 30 the listed rows accounted for only ~22% of
    # Self CPU, so the remainder was invisible in the tail rather than
    # genuinely unattributed. Costs nothing but report length.
    top_k: 100
    record_shapes: false
    emit_trace: false
  problem: burgers1d
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    # Back ON for the phase-3 track. It was 0 while phase 3 might have used
    # adaptive sampling, where the top-up (uniform, inside the box) refilled
    # exactly the leaves a residual-weighted draw had deliberately starved.
    # That conflict is gone: phase 3 now always samples uniformly
    # (trainer/epoch_loop.py forces it), so it takes _sample_per_expert_direct
    # and the floor is a clean allocation floor,
    #     n_e = max(min_points_per_expert, round(n_res * vol_e / vol_domain)).
    # Without it a thin leaf gets round(8192 * vol_e/vol) points -- for a
    # sliver like allen_cahn's 0.04-wide E3 that is close to zero, and the
    # expert simply stops training. Read only by adaptive/subdomain_data.py,
    # so it is inert in the root and fine-tune segments.
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 8192
    plot_samples_every: 5000
    # RAD RE-TARGET period. Under adaptive sampling this is how often the
    # residual DISTRIBUTION is rebuilt; the uniform half of the draw is still
    # refreshed every epoch (jaxpi/SOAP behaviour). With adaptive sampling OFF
    # this key keeps its old meaning and Adam/SOAP still redraw every epoch.
    #
    # 1000 is the Wu et al. value. It was effectively 1 in the last campaign
    # because trainer/epoch_loop.py forced the cadence to 1 for Adam/SOAP --
    # that override is correct for uniform resampling (it is exactly what
    # jaxpi does) but turned RAD into a bootstrap filter re-targeting on a
    # one-step-old residual estimate. That is what broke the roots.
    resample_every_epochs: 1000
    # Fresh uniform candidate pool drawn at each re-target, from which the
    # adaptive half is selected WITHOUT replacement. Wu et al. use 100k. The
    # old path drew from the previous epoch's own 8192 points, so the support
    # fed on itself. Costs one extra forward pass per 1000 epochs.
    rad_pool_size: 100000
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      # RAD weighting from Wu et al. (CMAME 2023), the reference the SOAP-PINN
      # paper cites: err = |r|^k / mean(|r|^k) + c, with k = phi_power and
      # c = phi_epsilon. The mean-normalisation makes the weights scale-free
      # as the residual shrinks by orders of magnitude, and the +c floor keeps
      # every region at nonzero probability. The previous 'quadratic' had
      # neither: on a spiky field it spans ~1e10 in probability, so a region
      # that goes quiet is abandoned and never revisited.
      phi: rad
      phi_epsilon: 1.0
      phi_power: 1.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    # RAD root, rel-L2 7.732e-04 @ ep100000. Root is SKIPPED in both tracks.
    pretrained_base_checkpoint: roots_checkpoints/single_precision/adaptive_sampling/schrodinger_root.pt
    # Phase-3 experts (10 leaves, 3x20), hard rel-L2 8.065e-04 @ ep79000.
    # Set for EVERY run this campaign, so root and phase 3 are both
    # skipped and pretrained_base_checkpoint above is ignored
    # (the orchestrator logs that) -- the expert checkpoint already
    # carries the base weights.
    pretrained_local_expert_checkpoint: roots_checkpoints/single_precision/adaptive_sampling/schrodinger_experts.pt
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    wavelet_threshold: 0.1
    window_smoothness_order: 2
    window_type: smoothstep
  seed: 42
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: soap_collar_geometry_sweep
experiments:
# Root + phase 3 skipped via the per-problem
# pretrained_local_expert_checkpoint; `epochs` is therefore unused.
# === A: fixed collar at the trained width ===
- name: burgers1d_A_sigma003
  problem: burgers1d
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.03
      adaptive_collar_size: false
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_A_sigma003
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.03
      adaptive_collar_size: false
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: schrodinger_A_sigma003
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.03
      adaptive_collar_size: false
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 20, 20, 20, 2]
# === B: fixed collar, wide ===
- name: burgers1d_B_sigma02
  problem: burgers1d
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.2
      adaptive_collar_size: false
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_B_sigma02
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.2
      adaptive_collar_size: false
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: schrodinger_B_sigma02
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.2
      adaptive_collar_size: false
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 20, 20, 20, 2]
# === C: per-face collars sized from the root gradient field ===
- name: burgers1d_C_adaptive_collar
  problem: burgers1d
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      adaptive_collar_size: true
