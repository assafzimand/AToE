# SMOKE (2026-10-22): minimal CPU check of the Burgers 3-seed protocol plan.
# Same stage/optimizer structure as experiments_plan.yaml, tiny budgets/sizes.
base_config:
  activation: tanh
  adam:
    betas: [0.9, 0.999]
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune: {adaptive_collar_grid: 257, adaptive_collar_quantile: 0.9, adaptive_collar_sigma_max: 0.5, adaptive_collar_sigma_min: 0.05,
