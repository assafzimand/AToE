# RAD + SOAP, roots only. Three runs, one per PDE, 100k root epochs each.
#
# WHY THIS IS ROOTS-ONLY. The previous campaign
# (soap_adaptive_sampling_baseline_20260729_021715) failed at the ROOT for two
# of three PDEs -- schrodinger stalled at rel-L2 9.200e-01 and was early-stopped
# at 11k, allen_cahn ran 5x behind its own previous run at every checkpoint.
# Phase 3 and fine-tune were therefore uninterpretable. Nothing downstream is
# worth running until the root is trustworthy again.
#
# WHAT WENT WRONG, and the four fixes now in the code:
#
#  1. MODEL INIT WAS NEVER SEEDED. run_training.py built the model before
#     anything called torch.manual_seed (the only seed call lived in
#     _setup_training, which runs after the model exists). Weight init
#     inherited whatever RNG state the process was in, so `seed: 42` did not
#     control it -- epoch-1 rel-L2 differed across campaigns on all three PDEs.
#     Fixed: run_training._seed_everything() runs before _build_model.
#
#  2. THE RAD CADENCE WAS OVERRIDDEN TO 1. trainer/epoch_loop.py forced
#     resample_every to 1 for Adam/SOAP. That is right for UNIFORM resampling
#     -- it is exactly what jaxpi does, a fresh uniform batch per step -- but
#     it was also applied to adaptive sampling, so the residual distribution
#     was rebuilt every epoch from a one-step-old single-forward-pass estimate
#     while SOAP's preconditioner EMA tried to track a moving objective.
#     Fixed: the uniform half still refreshes every epoch; the DISTRIBUTION is
#     re-targeted every sampling.resample_every_epochs.
#
#  3. THE CANDIDATE POOL FED ON ITSELF. The adaptive half was drawn from the
#     previous epoch's own 8192 points, with replacement -- a bootstrap filter,
#     with Gaussian jitter smearing the duplicates into clusters rather than
#     restoring coverage. Fixed: a fresh 100k uniform pool per re-target,
#     selected WITHOUT replacement (sampling.rad_pool_size).
#
#  4. THE WEIGHTING HAD NO FLOOR. phi: quadratic gives w = r^2, spanning ~1e10
#     in probability on a spiky field, so a quiet region is abandoned for good.
#     Fixed: phi: rad, w = |r|^k / mean(|r|^k) + c with k=1, c=1.
#
# NOTE none of this is validated upstream: the SOAP-PINN paper (arXiv
# 2502.00604) does not use RAD at all -- jaxpi samples a fresh UNIFORM batch
# every step -- so SOAP + RAD has no published precedent and the cadence comes
# from the RAD side of the literature (Wu et al., CMAME 2023, 1000 iterations;
# the SSBroyden PINN work uses ~500).
#
# WHAT THIS CAMPAIGN DOES NOT ANSWER. There is one arm. It shows whether the
# repaired RAD path trains a good root, not whether RAD BEATS uniform -- the
# uniform control from 26 Jul predates the seeding fix and is not comparable.
# If the roots come back healthy, the honest next step is a 2-arm rerun
# (adaptive on/off) at a fixed seed before anything is concluded.
#
# Read the curve at 10k / 30k / 100k, not just the final number: RAD's claim is
# faster convergence per point, so if it is not visible by 30k it is not there.
#
# Budget: 3 x 100k = 300k. min_epochs is 30000, so no root can early-stop
# before then.
#
# This is the DEFAULT plan: `python run_experiments.py` with no argument reads
# experiments_plan.yaml, so AWS_scripts/run_and_terminate.sh launches it as-is.
# A copy is kept at experiment_plans/soap_rad_roots.yaml.
#
# Run:  python run_experiments.py
#   or: bash AWS_scripts/run_and_terminate.sh      (runs, then stops the box)
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  soap:
    # Released jaxpi SOAP config (examples/*/configs/*soap.py), which is the
    # artifact behind the published PINN numbers. The paper text instead
    # recommends beta1=0.99 from its ablation -- worth a later sweep.
    betas:
    - 0.9
    - 0.999
    # EMA decay of the Shampoo preconditioner. Upstream's -1 sentinel reuses
    # betas[1], which would silently stretch the preconditioner's memory to
    # 0.999 (~1000 steps) purely as a side effect of the beta2 above. The SOAP
    # paper runs betas (0.95, 0.95), i.e. a 0.95 preconditioner EMA, so pin it
    # there and let beta2 govern Adam's second moment alone.
    shampoo_beta: 0.95
    precondition_frequency: 2
    weight_decay: 0.0
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      corrector_architecture: null
      corrector_init: zero
      single_corrector: false
      # 0 = ROOTS-ONLY campaign. The tree is still built and the leaves are
      # still spawned (free diagnostics), but no expert is trained.
      epochs: 0
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 5000
      lr_decay_rate: 0.9
      # 5000, not the 2000 used by root/phase-3. The jaxpi schedule is built
      # for a segment that converges early (the paper reports SOAP reaching
      # ~1e-4 within 10k iterations) and then polishes; decay every 2000 over
      # 100k is 47 decays, ending at ~7e-6. The previous run confirmed that is
      # too aggressive HERE: allen_cahn's fine-tune spent its last 60k epochs
      # below 1.7e-4 and was still improving (rel-L2 0.465 -> 0.315) when the
      # budget ran out. 5000 gives 19 decays, ending at ~1.4e-4, and is the
      # value jaxpi's own allen_cahn/configs/soap.py uses.
      lr_decay_steps: 5000
      # Grace period before the plateau test can fire. Covers the 5k-step
      # warmup plus 5k of decay, so a noisy/flat rel-L2 during the LR ramp
      # cannot early-stop the segment. Fine-tune reads this key; root and
      # phase 3 read the top-level min_epochs instead.
      min_epochs: 10000
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.03
      adaptive_collar_size: false
      adaptive_collar_quantile: 0.9
      # 0.1, not the old 0.02 default. The clamps are in sigma_fraction units,
      # so sigma_min=0.02 would let the gradient scan settle on a collar
      # NARROWER than the 0.03 that is currently failing -- the adaptive run
      # could then lose for reasons unrelated to the idea being tested. 0.1 is
      # also the measured no-training sweet spot (header table).
      adaptive_collar_sigma_min: 0.1
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_grid: 257
      # Corrector knobs (single_corrector: true). freeze_experts=false trains
      # the leaf experts jointly with c, so the interiors are NOT protected;
      # corrector_collar_ratio must then stay well below its 1.0 default or the
      # interiors would be starved of residual points and drift.
      freeze_experts: true
      corrector_collar_ratio: 1.0
    initial_train:
      epochs: 100000
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 5000
      lr_decay_rate: 0.9
      lr_decay_steps: 2000
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      # RAD weighting from Wu et al. (CMAME 2023), the reference the SOAP-PINN
      # paper cites: err = |r|^k / mean(|r|^k) + c, with k = phi_power and
      # c = phi_epsilon. The mean-normalisation makes the weights scale-free
      # as the residual shrinks by orders of magnitude, and the +c floor keeps
      # every region at nonzero probability. The previous 'quadratic' had
      # neither: on a spiky field it spans ~1e10 in probability, so a region
      # that goes quiet is abandoned and never revisited.
      phi: rad
      phi_epsilon: 1.0
      phi_power: 1.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    # Trained from scratch this campaign -- no pretrained root.
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      # RAD weighting from Wu et al. (CMAME 2023), the reference the SOAP-PINN
      # paper cites: err = |r|^k / mean(|r|^k) + c, with k = phi_power and
      # c = phi_epsilon. The mean-normalisation makes the weights scale-free
      # as the residual shrinks by orders of magnitude, and the +c floor keeps
      # every region at nonzero probability. The previous 'quadratic' had
      # neither: on a spiky field it spans ~1e10 in probability, so a region
      # that goes quiet is abandoned and never revisited.
      phi: rad
      phi_epsilon: 1.0
      phi_power: 1.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    # Trained from scratch this campaign -- no pretrained root.
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  epochs: 100000
  eval_every: 1000
  eval_only: false
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.9
  lr_decay_steps: 2000
  lr_schedule: exponential
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 5000
  # Applies to the root and phase-3 segments (fine_tune has its own key).
  # 30000, up from 10000. Schrodinger's root is bistable: in the campaign that
  # worked it sat at rel-L2 ~1.0 through epoch 2000 and only broke through at
  # 3000, and in the campaign that failed it never broke through and
  # patience_evals=10 killed it at 11000 with rel-L2 0.92. A 10k floor gives a
  # bistable problem 11 evals to escape, which is a coin flip. Burgers stopped
  # at 35k last time, so this floor is nearly free for the others.
  min_epochs: 30000
  model: AToELeaves
  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 99999
  # Stop a segment after 10 consecutive evals (= 10k epochs at eval_every
  # 1000) without a >1% rel-L2 improvement over the patience-local best.
  # The counter resets on any qualifying improvement, so this is "10k epochs
  # since the last real gain", not a wall-clock cap.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float32
  print_every: 1000
  # Bounded torch.profiler window per segment, written to
  # <run_dir>/profile_<segment>.txt. Observer only: no RNG or tensor math is
  # touched, so results are bit-identical with it on or off, and any profiler
  # error disables itself and lets training continue. 55 of 100k epochs are
  # recorded, so the cost is seconds. Read the PERCENTAGES in the report --
  # absolute times inside a profiled window are inflated by the profiler.
  profiling:
    # OFF. The previous run's schrodinger job was SIGKILLed (exit -9, the OOM
    # killer) with its last log line being the fine-tune profiler opening its
    # window; the two jobs that survived closed the same window in ~2 minutes.
    # Its fine-tune window is the heaviest of the three (10 experts in a Python
    # forward loop, 80 parameter tensors through SOAP). A SIGKILL cannot be
    # caught, so the fail-safe wrapping in trainer/profiling.py is no help --
    # the only guard is to not open the window. The profiling questions are
    # answered; turn this back on deliberately when there is a new one.
    enabled: false
    segments: all
    start_epoch: 2000
    warmup: 5
    active: 50
    # 100 rather than 30: at 30 the listed rows accounted for only ~22% of
    # Self CPU, so the remainder was invisible in the tail rather than
    # genuinely unattributed. Costs nothing but report length.
    top_k: 100
    record_shapes: false
    emit_trace: false
  problem: burgers1d
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    # 0 = OFF for this campaign, deliberately. The floor tops any short leaf up
    # with a UNIFORM draw inside its own box -- which is exactly what adaptive
    # sampling is trying not to do. Under a residual-weighted global draw a leaf
    # in an easy region legitimately receives few points, and the floor would
    # then inject 1024 uniform ones into precisely those leaves, diluting the
    # concentration the method exists to create. The floor postdates every
    # earlier adaptive-sampling run (added in f3a02e0), so leaving it on would
    # also make these results incomparable with those.
    min_points_per_expert: 0
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 8192
    plot_samples_every: 5000
    # RAD RE-TARGET period. Under adaptive sampling this is how often the
    # residual DISTRIBUTION is rebuilt; the uniform half of the draw is still
    # refreshed every epoch (jaxpi/SOAP behaviour). With adaptive sampling OFF
    # this key keeps its old meaning and Adam/SOAP still redraw every epoch.
    #
    # 1000 is the Wu et al. value. It was effectively 1 in the last campaign
    # because trainer/epoch_loop.py forced the cadence to 1 for Adam/SOAP --
    # that override is correct for uniform resampling (it is exactly what
    # jaxpi does) but turned RAD into a bootstrap filter re-targeting on a
    # one-step-old residual estimate. That is what broke the roots.
    resample_every_epochs: 1000
    # Fresh uniform candidate pool drawn at each re-target, from which the
    # adaptive half is selected WITHOUT replacement. Wu et al. use 100k. The
    # old path drew from the previous epoch's own 8192 points, so the support
    # fed on itself. Costs one extra forward pass per 1000 epochs.
    rad_pool_size: 100000
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      # RAD weighting from Wu et al. (CMAME 2023), the reference the SOAP-PINN
      # paper cites: err = |r|^k / mean(|r|^k) + c, with k = phi_power and
      # c = phi_epsilon. The mean-normalisation makes the weights scale-free
      # as the residual shrinks by orders of magnitude, and the +c floor keeps
      # every region at nonzero probability. The previous 'quadratic' had
      # neither: on a spiky field it spans ~1e10 in probability, so a region
      # that goes quiet is abandoned and never revisited.
      phi: rad
      phi_epsilon: 1.0
      phi_power: 1.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    # Trained from scratch this campaign -- no pretrained root.
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    wavelet_threshold: 0.1
    window_smoothness_order: 2
    window_type: smoothstep
  seed: 42
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: soap_rad_roots
experiments:
# Roots only: `epochs: 0` skips phase 3 and fine_tune.epochs is 0 in
# base_config. initial_train.epochs is the root budget.
- name: burgers1d_rad_root
  problem: burgers1d
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    initial_train:
      epochs: 100000
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_rad_root
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    initial_train:
      epochs: 100000
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: schrodinger_rad_root
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    initial_train:
      epochs: 100000
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 20, 20, 20, 2]
