# SOAP: repairing the fine-tune. Three tracks, 13 runs.
#
# The previous campaign (soap_capacity_vs_phase3_20260727_055053) established:
#   * Expert CAPACITY is not the constraint -- 4x35 experts (3,921 params) did
#     no better than 3x20 (921), and were slightly worse on burgers.
#   * PHASE 3 WORKS. schrodinger reached 8.018e-04 against a 7.399e-04 root;
#     allen_cahn 2.373e-02 against 1.946e-02.
#   * THE FINE-TUNE THEN DESTROYS IT. In all three B runs the fine-tune's best
#     was its FIRST eval, after which it regressed (schrodinger 7.98e-04 ->
#     1.71e-01).
#
# Cause, measured on the phase-3 checkpoints: switching from the split/hard
# phase-3 objective to the soft-blended composed one raises the residual by
# 268x-4000x with rel-L2 UNCHANGED. On a 260^2 grid, 99.97% (burgers) and
# 99.74% (allen_cahn) of the squared residual sits inside the collars, which
# are 7.0% and 5.8% of the domain -- mean res^2 inside/outside is 49,147x and
# 6,346x. The fine-tune is optimising a blending artifact.
#
# Mechanism: sum_j psi_j = 1 implies sum_j psi_j'' = 0, so the artifact is
# sum_j psi_j''(u_j - ubar) ~ max|rho''_N| * du / delta^2 -- proportional to
# expert DISAGREEMENT du, amplified by 1/delta^2. Both factors are bad: the
# window support is [a-delta, b+delta] but phase 3 samples only inside [a,b]
# (collar_data_ratio was 0), so each expert is blended in on a strip where it
# was never trained. Measured du for burgers: median 1.3e-02, p90 0.927.
#
# Widening sigma alone does NOT fix it -- it cuts 1/delta^2 but pulls in MORE
# untrained extrapolation. Measured with no training at all, from the phase-3
# checkpoints (rel-L2, soft blending):
#
#            hard      s=.03/N4   s=.1/N2    s=.2/N2    s=.3/N2
#   schrod   8.018e-4  7.981e-4   7.901e-4   9.896e-4   5.474e-3
#   allen_c  2.373e-2  2.365e-2   2.323e-2   6.701e-2   1.437e-1
#   burgers  3.626e-2  4.162e-2   2.512e-1   5.742e-1   8.423e-1
#
# So sigma 0.1 is the A-track sweet spot and 0.2 already costs 2.8x on
# allen_cahn. Smoothstep order 4 -> 2 is near-neutral (max|rho''| 9.372 ->
# 5.774) but free, so it is on everywhere.
#
#   A  fine-tune from PHASE-3 EXPERTS, 30k       allen_cahn, schrodinger
#      A1  corrector u = u_soft + chi*c, experts trainable too, sigma 0.03,
#          corrector_collar_ratio 0.2
#      A2  adaptive per-face collars from the root gradient, q 0.9
#      A3  sigma 0.1 + collar_data_ratio 0.5
#
#   B  fine-tune from ROOT, phase 3 skipped, 100k     all three PDEs
#      B1  sigma 0.2
#      B2  sigma 0.2 + collar_data_ratio 0.5
#      The sigma table above does NOT apply here: B's experts start random, so
#      there is no trained-interior / untrained-collar split to damage.
#
#   C  burgers only: phase 3 (100k) -> fine_tune (30k), sigma 0.2 +
#      collar_data_ratio 0.5. The ratio acts in BOTH segments, so phase 3
#      trains the experts in the strip the blend will later sample. The only
#      run that attacks expert disagreement at its source.
#
# Budget: A 6 x 30k = 180k, B 6 x 100k = 600k, C 1 x 130k = 130k -> 910k.
# No root is trained anywhere; every problem loads its root (and A its experts)
# from roots_checkpoints/single_precision/.
#
# Still deliberately plain: no adaptive sampling, no LRA, no causal training,
# no continuity term (it exists only in the split/phase-3 loss anyway).
#
# This is the DEFAULT plan: `python run_experiments.py` with no argument reads
# experiments_plan.yaml, so AWS_scripts/run_and_terminate.sh launches it as-is.
# A copy is kept at experiment_plans/soap_finetune_repair.yaml; the two earlier
# campaigns are preserved at soap_100k_root_vs_phase3.yaml and
# soap_capacity_vs_phase3.yaml.
#
# Run:  python run_experiments.py
#   or: bash AWS_scripts/run_and_terminate.sh      (runs, then stops the box)
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  soap:
    # Released jaxpi SOAP config (examples/*/configs/*soap.py), which is the
    # artifact behind the published PINN numbers. The paper text instead
    # recommends beta1=0.99 from its ablation -- worth a later sweep.
    betas:
    - 0.9
    - 0.999
    # EMA decay of the Shampoo preconditioner. Upstream's -1 sentinel reuses
    # betas[1], which would silently stretch the preconditioner's memory to
    # 0.999 (~1000 steps) purely as a side effect of the beta2 above. The SOAP
    # paper runs betas (0.95, 0.95), i.e. a 0.95 preconditioner EMA, so pin it
    # there and let beta2 govern Adam's second moment alone.
    shampoo_beta: 0.95
    precondition_frequency: 2
    weight_decay: 0.0
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      corrector_architecture: null
      corrector_init: zero
      single_corrector: false
      epochs: 100000
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 5000
      lr_decay_rate: 0.9
      # 5000, not the 2000 used by root/phase-3. The jaxpi schedule is built
      # for a segment that converges early (the paper reports SOAP reaching
      # ~1e-4 within 10k iterations) and then polishes; decay every 2000 over
      # 100k is 47 decays, ending at ~7e-6. The previous run confirmed that is
      # too aggressive HERE: allen_cahn's fine-tune spent its last 60k epochs
      # below 1.7e-4 and was still improving (rel-L2 0.465 -> 0.315) when the
      # budget ran out. 5000 gives 19 decays, ending at ~1.4e-4, and is the
      # value jaxpi's own allen_cahn/configs/soap.py uses.
      lr_decay_steps: 5000
      # Grace period before the plateau test can fire. Covers the 5k-step
      # warmup plus 5k of decay, so a noisy/flat rel-L2 during the LR ramp
      # cannot early-stop the segment. Fine-tune reads this key; root and
      # phase 3 read the top-level min_epochs instead.
      min_epochs: 10000
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.03
      adaptive_collar_size: false
      adaptive_collar_quantile: 0.9
      # 0.1, not the old 0.02 default. The clamps are in sigma_fraction units,
      # so sigma_min=0.02 would let the gradient scan settle on a collar
      # NARROWER than the 0.03 that is currently failing -- the adaptive run
      # could then lose for reasons unrelated to the idea being tested. 0.1 is
      # also the measured no-training sweet spot (header table).
      adaptive_collar_sigma_min: 0.1
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_grid: 257
      # Corrector knobs (single_corrector: true). freeze_experts=false trains
      # the leaf experts jointly with c, so the interiors are NOT protected;
      # corrector_collar_ratio must then stay well below its 1.0 default or the
      # interiors would be starved of residual points and drift.
      freeze_experts: true
      corrector_collar_ratio: 1.0
    initial_train:
      epochs: 100000
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 5000
      lr_decay_rate: 0.9
      lr_decay_steps: 2000
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    # Root from the 20260726_200805 campaign: rel-L2 1.946e-02 @ ep100000.
    pretrained_base_checkpoint: roots_checkpoints/single_precision/allen_cahn_root.pt
    # Phase-3 experts (7 leaves, 3x20), rel-L2 2.373e-02 @ ep100000.
    # The A runs set this per experiment; null here so B starts from root.
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    # Root from the 20260726_200805 campaign: rel-L2 2.888e-04 @ ep25000.
    pretrained_base_checkpoint: roots_checkpoints/single_precision/burgers_root.pt
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  epochs: 100000
  eval_every: 1000
  eval_only: false
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.9
  lr_decay_steps: 2000
  lr_schedule: exponential
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 5000
  # Applies to the root and phase-3 segments (fine_tune has its own key).
  min_epochs: 10000
  model: AToELeaves
  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 99999
  # Stop a segment after 10 consecutive evals (= 10k epochs at eval_every
  # 1000) without a >1% rel-L2 improvement over the patience-local best.
  # The counter resets on any qualifying improvement, so this is "10k epochs
  # since the last real gain", not a wall-clock cap.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float32
  print_every: 1000
  # Bounded torch.profiler window per segment, written to
  # <run_dir>/profile_<segment>.txt. Observer only: no RNG or tensor math is
  # touched, so results are bit-identical with it on or off, and any profiler
  # error disables itself and lets training continue. 55 of 100k epochs are
  # recorded, so the cost is seconds. Read the PERCENTAGES in the report --
  # absolute times inside a profiled window are inflated by the profiler.
  profiling:
    # OFF. The previous run's schrodinger job was SIGKILLed (exit -9, the OOM
    # killer) with its last log line being the fine-tune profiler opening its
    # window; the two jobs that survived closed the same window in ~2 minutes.
    # Its fine-tune window is the heaviest of the three (10 experts in a Python
    # forward loop, 80 parameter tensors through SOAP). A SIGKILL cannot be
    # caught, so the fail-safe wrapping in trainer/profiling.py is no help --
    # the only guard is to not open the window. The profiling questions are
    # answered; turn this back on deliberately when there is a new one.
    enabled: false
    segments: all
    start_epoch: 2000
    warmup: 5
    active: 50
    # 100 rather than 30: at 30 the listed rows accounted for only ~22% of
    # Self CPU, so the remainder was invisible in the tail rather than
    # genuinely unattributed. Costs nothing but report length.
    top_k: 100
    record_shapes: false
    emit_trace: false
  problem: burgers1d
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    # Floor on RESIDUAL points per expert in phase 3. The global draw is
    # filtered by region, so thin leaves would otherwise get very few points;
    # anything short is topped up with a uniform draw inside its own box.
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 8192
    plot_samples_every: 0
    resample_every_epochs: 1
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    # Root from the 20260726_200805 campaign: rel-L2 7.399e-04 @ ep100000.
    # Rescued from the run the OOM killer took down mid-fine-tune -- the root
    # segment had already finished and checkpointed.
    pretrained_base_checkpoint: roots_checkpoints/single_precision/schrodinger_root.pt
    # Phase-3 experts (10 leaves, 3x20), rel-L2 8.018e-04 @ ep67000.
    # The A runs set this per experiment; null here so B starts from root.
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    wavelet_threshold: 0.1
    window_smoothness_order: 2
    window_type: smoothstep
  seed: 42
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: soap_finetune_repair
experiments:
# === A: fine-tune from PHASE-3 EXPERTS (root and phase 3 both skipped) ===
# 30k each. The loaded-experts path logs hard= and soft= rel-L2 before the
# first step -- if soft is much worse than hard, that config is already dead.
# A1  chi-gated corrector, experts trainable alongside c.
- name: allen_cahn_A1_corrector_unfrozen
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.03
      single_corrector: true
      freeze_experts: false
      corrector_collar_ratio: 0.2
  allen_cahn:
    pretrained_local_expert_checkpoint: roots_checkpoints/single_precision/allen_cahn_experts.pt
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
# A2  per-face collars sized from the root gradient field.
- name: allen_cahn_A2_adaptive_collar
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      adaptive_collar_size: true
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_min: 0.1
      adaptive_collar_sigma_max: 0.5
  allen_cahn:
    pretrained_local_expert_checkpoint: roots_checkpoints/single_precision/allen_cahn_experts.pt
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
# A3  sigma 0.1 + collar data 0.5.
- name: allen_cahn_A3_sigma01_collardata
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.1
  sampling:
    collar_data_ratio: 0.5
  allen_cahn:
    pretrained_local_expert_checkpoint: roots_checkpoints/single_precision/allen_cahn_experts.pt
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
# A1  chi-gated corrector, experts trainable alongside c.
- name: schrodinger_A1_corrector_unfrozen
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.03
      single_corrector: true
      freeze_experts: false
      corrector_collar_ratio: 0.2
  schrodinger:
    pretrained_local_expert_checkpoint: roots_checkpoints/single_precision/schrodinger_experts.pt
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 20, 20, 20, 2]
# A2  per-face collars sized from the root gradient field.
- name: schrodinger_A2_adaptive_collar
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      adaptive_collar_size: true
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_min: 0.1
      adaptive_collar_sigma_max: 0.5
  schrodinger:
    pretrained_local_expert_checkpoint: roots_checkpoints/single_precision/schrodinger_experts.pt
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 20, 20, 20, 2]
# A3  sigma 0.1 + collar data 0.5.
- name: schrodinger_A3_sigma01_collardata
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.1
  sampling:
    collar_data_ratio: 0.5
  schrodinger:
    pretrained_local_expert_checkpoint: roots_checkpoints/single_precision/schrodinger_experts.pt
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 20, 20, 20, 2]
# === B: fine-tune from ROOT (phase 3 skipped, experts fresh) ===
# 100k each, sigma 0.2.
- name: burgers1d_B1_sigma02
  problem: burgers1d
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 100000
      sigma_fraction: 0.2
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_B1_sigma02
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 100000
      sigma_fraction: 0.2
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: schrodinger_B1_sigma02
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 100000
      sigma_fraction: 0.2
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 20, 20, 20, 2]
- name: burgers1d_B2_sigma02_collardata
  problem: burgers1d
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 100000
      sigma_fraction: 0.2
  sampling:
    collar_data_ratio: 0.5
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_B2_sigma02_collardata
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 100000
      sigma_fraction: 0.2
  sampling:
    collar_data_ratio: 0.5
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: schrodinger_B2_sigma02_collardata
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  adaptive_pinn:
    fine_tune:
      epochs: 100000
      sigma_fraction: 0.2
  sampling:
    collar_data_ratio: 0.5
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 20, 20, 20, 2]
# === C: burgers only -- full flow, phase 3 (100k) -> fine_tune (30k) ===
# B2 for burgers with phase 3 restored. collar_data_ratio 0.5 acts in BOTH
# segments, so phase 3 trains the experts in the strip the blend will later
# sample -- the only run attacking expert disagreement at its source.
- name: burgers1d_C_phase3_finetune
  problem: burgers1d
  model: AToELeaves
  epochs: 100000
  adaptive_pinn:
    fine_tune:
      epochs: 30000
      sigma_fraction: 0.2
  sampling:
    collar_data_ratio: 0.5
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
