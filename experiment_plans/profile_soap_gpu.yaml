# One short run to verify torch.profiler works on the GPU box.
#
# Same scale as the real campaign -- 6x100 root, 3x20 experts, 8192 residual
# points resampled every epoch, SOAP with precondition_frequency 2, float32 --
# but only 500 epochs per segment, and it runs ALL THREE phases (root ->
# phase 3 -> fine_tune) so every profiled segment is exercised.
#
# Profiling window: 50 recorded steps (5 warmup) starting 200 epochs into each
# segment, i.e. well past the 50-step LR warmup and in steady state. Writes
# <run_dir>/profile_root.txt, profile_phase3.txt, profile_fine_tune.txt --
# PyTorch key_averages tables; read the Self CUDA % column.
#
# Purpose is the profile, NOT accuracy. 500 epochs proves nothing about rel-L2.
#
# Run:  bash AWS_scripts/run_profile_check.sh
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.02
      adaptive_collar_size: false
      corrector_architecture: null
      corrector_init: zero
      epochs: 500
      lr: 0.001
      lr_decay_rate: 0.9
      lr_decay_steps: 100
      lr_schedule: exponential
      lr_warmup_steps: 50
      min_epochs: 1
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.03
      single_corrector: false
    initial_train:
      epochs: 500
      lr: 0.001
      lr_decay_rate: 0.9
      lr_decay_steps: 100
      lr_schedule: exponential
      lr_warmup_steps: 50
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 4
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 4
    window_type: smoothstep
  cuda: true
  epochs: 500
  eval_every: 100
  eval_only: false
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.9
  lr_decay_steps: 100
  lr_schedule: exponential
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 50
  min_epochs: 1
  model: AToELeaves
  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 99999
  patience_evals: 99999
  patience_rel_delta: 0.01
  precision: float32
  print_every: 100
  problem: burgers1d
  profiling:
    active: 50
    emit_trace: false
    enabled: true
    record_shapes: false
    segments: all
    start_epoch: 200
    top_k: 40
    warmup: 5
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 8192
    plot_samples_every: 0
    resample_every_epochs: 1
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    wavelet_threshold: 0.1
    window_smoothness_order: 4
    window_type: smoothstep
  seed: 42
  soap:
    betas:
    - 0.9
    - 0.999
    precondition_frequency: 2
    shampoo_beta: 0.95
    weight_decay: 0.0
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: profile_soap_gpu_check
experiments:
- base_architecture:
  - 2
  - 100
  - 100
  - 100
  - 100
  - 100
  - 100
  - 1
  epochs: 500
  experts_architecture:
  - 2
  - 20
  - 20
  - 20
  - 1
  model: AToELeaves
  name: burgers1d_profile_all_phases
  problem: burgers1d
