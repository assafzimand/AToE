    - 0.95
    precondition_frequency: 10
    weight_decay: 0.0
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: adaptive_collar_rad_verification
experiments:
# Architectures MUST match the checkpoints: base [2,60,60,60,60,out],
# experts [2,20,20,20,out]. `epochs: 0` is the phase-3 budget and is inert
# here -- the pretrained-experts path returns before phase 3 is reached.
- name: burgers1d_adaptive_collar_rad
  problem: burgers1d
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 60, 60, 60, 60, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_adaptive_collar_rad
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 60, 60, 60, 60, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: schrodinger_adaptive_collar_rad
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 60, 60, 60, 60, 2]
  experts_architecture: [2, 20, 20, 20, 2]
