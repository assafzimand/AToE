# ══════════════════════════════════════════════════════════════════════════
# VERIFICATION SWEEP: adaptive collar + RAD, float64, SSBroyden
# ══════════════════════════════════════════════════════════════════════════
#
# Reproduces the one configuration that has actually beaten its own phase-3
# checkpoint -- outputs/experiments/adaptive_collar_40k_20260726_050257 --
# and extends it to schrodinger, which that run never covered.
#
# What that run achieved (comparison_summary.csv, final rel-L2):
#   burgers1d_adaptive_collar_adaptsamp05   1.592e-07   <- RAD on, THIS config
#   burgers1d_adaptive_collar_data05        1.145e-06   collar_data 0.5, RAD off
#   burgers1d_adaptive_collar               1.456e-03   RAD off, no collar data
#   allen_cahn_adaptive_collar              2.994e-05   RAD OFF  (see note below)
#
# Starting points (hard-indicator rel-L2 stored in each checkpoint):
#   burgers1d     2.288e-07    6 leaves
#   allen_cahn    3.321e-05    7 leaves
#   schrodinger   3.786e-04   10 leaves
# These are float64 experts from a 60-wide root, i.e. 2-4 orders better than
# anything the recent float32 campaigns started from. The bar for "the
# fine-tune helped" is correspondingly high: burgers improved 1.4x and
# allen_cahn 1.1x in the reference run. Schrodinger is the open question --
# weakest start, most leaves, never fine-tuned from these experts.
#
# ── ONE DELIBERATE DEVIATION FROM THE REFERENCE RUN ──────────────────────
# allen_cahn's 2.994e-05 was produced with adaptive_sampling DISABLED. Only
# burgers was ever run with RAD. This sweep puts RAD 0.5 on all three, so the
# allen_cahn cell is a NEW configuration, not a reproduction. If it comes
# back worse than 3.321e-05, RAD is the first suspect and the control is one
# line away: allen_cahn.adaptive_sampling.enabled -> false.
#
# ── CODE HAS MOVED SINCE THE REFERENCE COMMIT (5a1458d) ──────────────────
# 17 commits, ~1000 lines. Almost all of it is off this path: phase-3
# per-expert sampling (phase 3 never runs here), SOAP eps/shampoo_beta (no
# SOAP here), the full-batch dataloader shortcut (Adam/SOAP only -- the
# quasi-Newton path calls loss_fn directly), profiling (defaults off),
# incremental metrics.json writes (no effect on training). ONE change is on
# this path:
#
#   RAD now draws from a fresh 100k uniform pool instead of from the previous
#   epoch's own training points, and selects WITHOUT replacement.
#
# At 5a1458d the candidate pool was `model._residual_cache` -- residuals on
# the 20k points the model was already training on, i.e. the previous
# adaptive draw. That is a bootstrap filter: the support feeds on itself and
# only the uniform half rejuvenates it, and with a 20k pool against a 10k
# draw `replacement=True` returned heavy duplicates. The current code follows
# Wu et al. (CMAME 2023): fresh uniform pool per RAD cycle, drawn without
# replacement (100k >= 4 x 10k selects the no-replacement path).
#
# This should be strictly better, but it is NOT what produced 1.592e-07. If
# burgers misses that number, look here first -- the fix is a revert, not a
# config change.
#
# Everything else is preserved: SSBroyden refreshes on resample_every_epochs
# (the 1-epoch override is Adam/SOAP only), phi stays 'quadratic' (the new
# mean-normalised 'rad' phi is deliberately NOT used), and the smoothstep
# windows are the same product, written as an explicit multiply chain instead
# of torch.prod for a cheaper backward.
#
# ── WHAT RUNS ────────────────────────────────────────────────────────────
# pretrained_local_expert_checkpoint short-circuits the orchestrator: root
# and phase 3 are both skipped and only the joint fine-tune runs. `epochs: 0`
# is therefore inert, as is initial_train.epochs.
#
# Fine-tune: 40k SSBroyden, NO corrector, adaptive collars sized from the
# root at q=0.9 clamped to [0.03, 0.5], RAD 0.5 / phi quadratic re-targeting
# every 500 epochs, collar_data_ratio 0 (RAD does the targeting; the
# reference's best run had collar data off).
#
# Budget: 3 x 40k = 120k SSBroyden iterations. Early stop after 10 evals
# (10k epochs) without a 1% improvement; no grace period (min_epochs 1).
#
# MEMORY: SSBroyden holds a dense n_params^2 inverse Hessian over the
# trainable set. Leaves only: burgers 6x921=5.5k params (~244 MB float64),
# allen_cahn 7x921=6.4k (~333 MB), schrodinger 10x942=9.4k (~710 MB).
# rad_pool_chunk is 5000 rather than the 20000 default because the pool probe
# is a composed forward with 2nd derivatives over every leaf in float64, and
# schrodinger has been OOM-killed on this path before. Chunks are
# independent, so this is numerically identical -- just smaller allocations.
#
# This is the DEFAULT plan: `python run_experiments.py` with no argument
# reads experiments_plan.yaml, so AWS_scripts/run_and_terminate.sh launches
# it as-is. A copy is kept at
# experiment_plans/adaptive_collar_rad_verification.yaml.
#
# Run:  python run_experiments.py
#   or: bash AWS_scripts/run_and_terminate.sh      (runs, then stops the box)
# ══════════════════════════════════════════════════════════════════════════
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      # Adaptive collar geometry: per-face widths sized from the root's
      # directional gradient at quantile 0.9, clamped to [0.03, 0.5] in
      # sigma_fraction units. sigma_fraction below is the FALLBACK only --
      # it applies if collar sizing fails.
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.03
      adaptive_collar_size: true
      corrector_architecture: null
      corrector_init: zero
      epochs: 40000
      lr: 0.0001
      lr_schedule: none
      min_epochs: 1
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.05
      single_corrector: false
    initial_train:
      # INERT on this path: pretrained_local_expert_checkpoint skips root and
      # phase 3 entirely. Kept because config validation requires the key.
      epochs: 41000
      lr: 0.001
      lr_decay_rate: 0.98
      lr_decay_steps: 1000
      lr_schedule: none
      lr_warmup_steps: 0
      optimizer_1: adam
      optimizer_2: ssbroyden
      optimizer_switch_epoch: 1000
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      # NOTE: the reference allen_cahn result (2.994e-05) was produced with
      # this OFF. Set enabled: false to reproduce it exactly.
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: roots_checkpoints/double_precision/allen_cahn_experts.pt
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: roots_checkpoints/double_precision/burgers_experts.pt
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  epochs: 41000
  eval_every: 1000
  eval_only: false
  kdv:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 16
      tol_schedule:
      - 0.01
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 2.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 1000
    mu: 0.022
    new_norm_threshold: 0.2
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 3
    tree_smoothness_threshold: 0.4
    wavelet_threshold: 0.0025
    window_smoothness_order: 3
    window_type: smoothstep
  ks:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    alpha: 6.25
    beta: 0.390625
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 1.0
    gamma: 0.00152587890625
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 10.0
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - 0.0
      - 6.283185307179586
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.3
    wavelet_threshold: 0.04
    window_smoothness_order: 4
    window_type: smoothstep
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_schedule: none
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 0
  min_epochs: 1
  model: AToELeaves
  optimizer_1: adam
  optimizer_2: ssbroyden
  optimizer_switch_epoch: 1000
  # 10 evals x eval_every 1000 = 10k epochs without a 1% improvement.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float64
  print_every: 1000
  problem: burgers1d
  profiling:
    enabled: false
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 20000
    plot_samples_every: 1000
    # RAD candidate pool, redrawn uniformly every resample_every_epochs.
    # 100k against a 10k adaptive draw (n_residual_train x adaptive_ratio)
    # also puts the sampler on its without-replacement path (pool >= 4x draw).
    rad_pool_size: 100000
    # Below the 20000 default: the pool probe is a composed forward with 2nd
    # derivatives over every leaf in float64. Numerically identical, smaller
    # peak allocation.
    rad_pool_chunk: 5000
    # SSBroyden honours this directly (the every-epoch override is Adam/SOAP
