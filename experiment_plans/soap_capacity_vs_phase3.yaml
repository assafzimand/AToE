# SOAP: expert capacity (A) vs. phase-3 warm start (B). Six runs, 3 PDEs x 2
# variants. NO ROOT IS TRAINED -- every problem loads its root from
# roots_checkpoints/single_precision/, so the orchestrator logs "Root skipped"
# and goes straight to the tree build. All six runs therefore share the exact
# same root per PDE (the bests from the 20260726_200805 campaign), which is
# what makes A and B comparable at all.
#
#   A  fine_tune only        (adaptive_pinn.epochs = 0)   experts 4x35
#      Tree built from the loaded root, all leaves spawned, phase 3 SKIPPED,
#      joint PoU composition trained directly for 100k. The experts start from
#      a FRESH init (root 6x100 vs experts 4x35 -> no parent-weight copy), so
#      only the tree GEOMETRY carries over: the composition begins at rel-L2
#      ~1.0 regardless of how good the root was. This variant asks whether the
#      previous run's plateau was expert capacity.
#
#   B  phase 3 (100k) -> fine_tune (30k)                  experts 3x20
#      The regular flow, at the previous run's expert size. Phase 3 gives each
#      leaf a warm start inside its own box before the joint fine-tune.
#
# NOTE the two variants differ in BOTH expert size and phase 3, so A-vs-B is
# not a clean read on either one on its own. Each is a clean read against the
# previous campaign, which was A-at-3x20.
#
# Expert parameter counts ([2,H,...,H,out] MLPs) against a 50,901-param root:
#     4x35 = 3,921 each   ->  burgers 6 leaves 23.5k (0.46x root)
#                             allen_cahn 7 leaves 27.4k (0.54x)
#                             schrodinger 10 leaves 39.6k (0.78x)
#     3x20 =   921 each   ->  burgers 6 leaves  5.5k (0.11x root)
#
# Every segment uses SOAP with the jaxpi schedule (linear warmup 5k to 1e-3,
# then exponential decay 0.9). Root/phase-3 decay every 2k; fine_tune decays
# every 5k -- see the comment on fine_tune.lr_decay_steps. Deliberately plain:
# no adaptive collars, no adaptive sampling, no collar data, no LRA, no causal
# training. sigma_fraction is fixed at 0.03 and the smoothstep order at 4 for
# every PDE (not tied to the PDE's own order).
#
# Budget: A = 100k iters/run, B = 130k iters/run -> 690k total, no root time.
#
# This is the DEFAULT plan: `python run_experiments.py` with no argument reads
# experiments_plan.yaml, so AWS_scripts/run_and_terminate.sh launches it as-is.
# A copy is kept at experiment_plans/soap_100k_root_vs_phase3.yaml.
#
# Run:  python run_experiments.py
#   or: bash AWS_scripts/run_and_terminate.sh      (runs, then stops the box)
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  soap:
    # Released jaxpi SOAP config (examples/*/configs/*soap.py), which is the
    # artifact behind the published PINN numbers. The paper text instead
    # recommends beta1=0.99 from its ablation -- worth a later sweep.
    betas:
    - 0.9
    - 0.999
    # EMA decay of the Shampoo preconditioner. Upstream's -1 sentinel reuses
    # betas[1], which would silently stretch the preconditioner's memory to
    # 0.999 (~1000 steps) purely as a side effect of the beta2 above. The SOAP
    # paper runs betas (0.95, 0.95), i.e. a 0.95 preconditioner EMA, so pin it
    # there and let beta2 govern Adam's second moment alone.
    shampoo_beta: 0.95
    precondition_frequency: 2
    weight_decay: 0.0
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      corrector_architecture: null
      corrector_init: zero
      single_corrector: false
      epochs: 100000
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 5000
      lr_decay_rate: 0.9
      # 5000, not the 2000 used by root/phase-3. The jaxpi schedule is built
      # for a segment that converges early (the paper reports SOAP reaching
      # ~1e-4 within 10k iterations) and then polishes; decay every 2000 over
      # 100k is 47 decays, ending at ~7e-6. The previous run confirmed that is
      # too aggressive HERE: allen_cahn's fine-tune spent its last 60k epochs
      # below 1.7e-4 and was still improving (rel-L2 0.465 -> 0.315) when the
      # budget ran out. 5000 gives 19 decays, ending at ~1.4e-4, and is the
      # value jaxpi's own allen_cahn/configs/soap.py uses.
      lr_decay_steps: 5000
      # Grace period before the plateau test can fire. Covers the 5k-step
      # warmup plus 5k of decay, so a noisy/flat rel-L2 during the LR ramp
      # cannot early-stop the segment. Fine-tune reads this key; root and
      # phase 3 read the top-level min_epochs instead.
      min_epochs: 10000
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.03
      adaptive_collar_size: false
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_min: 0.02
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_grid: 257
    initial_train:
      epochs: 100000
      lr: 0.001
      lr_schedule: exponential
      lr_warmup_steps: 5000
      lr_decay_rate: 0.9
      lr_decay_steps: 2000
      optimizer_1: soap
      optimizer_2: null
      optimizer_switch_epoch: 99999
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    # Root from the 20260726_200805 campaign: rel-L2 1.946e-02 @ ep100000.
    pretrained_base_checkpoint: roots_checkpoints/single_precision/allen_cahn_root.pt
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.002
    window_smoothness_order: 4
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    # Root from the 20260726_200805 campaign: rel-L2 2.888e-04 @ ep25000.
    pretrained_base_checkpoint: roots_checkpoints/single_precision/burgers_root.pt
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    wavelet_threshold: 0.001
    window_smoothness_order: 4
    window_type: smoothstep
  cuda: true
  epochs: 100000
  eval_every: 1000
  eval_only: false
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.9
  lr_decay_steps: 2000
  lr_schedule: exponential
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 5000
  # Applies to the root and phase-3 segments (fine_tune has its own key).
  min_epochs: 10000
  model: AToELeaves
  optimizer_1: soap
  optimizer_2: null
  optimizer_switch_epoch: 99999
  # Stop a segment after 10 consecutive evals (= 10k epochs at eval_every
  # 1000) without a >1% rel-L2 improvement over the patience-local best.
  # The counter resets on any qualifying improvement, so this is "10k epochs
  # since the last real gain", not a wall-clock cap.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float32
  print_every: 1000
  # Bounded torch.profiler window per segment, written to
  # <run_dir>/profile_<segment>.txt. Observer only: no RNG or tensor math is
  # touched, so results are bit-identical with it on or off, and any profiler
  # error disables itself and lets training continue. 55 of 100k epochs are
  # recorded, so the cost is seconds. Read the PERCENTAGES in the report --
  # absolute times inside a profiled window are inflated by the profiler.
  profiling:
    # OFF. The previous run's schrodinger job was SIGKILLed (exit -9, the OOM
    # killer) with its last log line being the fine-tune profiler opening its
    # window; the two jobs that survived closed the same window in ~2 minutes.
    # Its fine-tune window is the heaviest of the three (10 experts in a Python
    # forward loop, 80 parameter tensors through SOAP). A SIGKILL cannot be
    # caught, so the fail-safe wrapping in trainer/profiling.py is no help --
    # the only guard is to not open the window. The profiling questions are
    # answered; turn this back on deliberately when there is a new one.
    enabled: false
    segments: all
    start_epoch: 2000
    warmup: 5
    active: 50
    # 100 rather than 30: at 30 the listed rows accounted for only ~22% of
    # Self CPU, so the remainder was invisible in the tail rather than
    # genuinely unattributed. Costs nothing but report length.
    top_k: 100
    record_shapes: false
    emit_trace: false
  problem: burgers1d
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    # Floor on RESIDUAL points per expert in phase 3. The global draw is
    # filtered by region, so thin leaves would otherwise get very few points;
    # anything short is topped up with a uniform draw inside its own box.
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 8192
    plot_samples_every: 0
    resample_every_epochs: 1
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    # Root from the 20260726_200805 campaign: rel-L2 7.399e-04 @ ep100000.
    # Rescued from the run the OOM killer took down mid-fine-tune -- the root
    # segment had already finished and checkpointed.
    pretrained_base_checkpoint: roots_checkpoints/single_precision/schrodinger_root.pt
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    wavelet_threshold: 0.1
    window_smoothness_order: 4
    window_type: smoothstep
  seed: 42
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: soap_100k_root_vs_phase3
experiments:
# ── A: fine_tune only, phase 3 skipped (epochs: 0), experts 4x35 ──
- name: burgers1d_A_root_finetune
  problem: burgers1d
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 35, 35, 35, 35, 1]
- name: allen_cahn_A_root_finetune
  problem: allen_cahn
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 35, 35, 35, 35, 1]
- name: schrodinger_A_root_finetune
  problem: schrodinger
  model: AToELeaves
  epochs: 0
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 35, 35, 35, 35, 2]
# ── B: phase 3 (100k) -> fine_tune (30k), experts 3x20 as before ──
- name: burgers1d_B_phase3_finetune
  problem: burgers1d
  model: AToELeaves
  epochs: 100000
  adaptive_pinn:
    fine_tune:
      epochs: 30000
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_B_phase3_finetune
  problem: allen_cahn
  model: AToELeaves
  epochs: 100000
  adaptive_pinn:
    fine_tune:
      epochs: 30000
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: schrodinger_B_phase3_finetune
  problem: schrodinger
  model: AToELeaves
  epochs: 100000
  adaptive_pinn:
    fine_tune:
      epochs: 30000
  base_architecture: [2, 100, 100, 100, 100, 100, 100, 2]
  experts_architecture: [2, 20, 20, 20, 2]
