# ══════════════════════════════════════════════════════════════════════════
# FULL FLOW FROM SCRATCH: root -> phase 3 -> fine-tune, 40k SSBroyden each
# ══════════════════════════════════════════════════════════════════════════
#
# No pretrained checkpoints anywhere. Each PDE trains all three segments in
# one run, so the roots are built WITH adaptive sampling and are therefore
# comparable to the experts and the fine-tune that follow them.
#
# ORDER: schrodinger runs FIRST as the OOM canary. Its root has the same
# parameter count as the others (+65 for output_dim 2), the largest autograd
# graph (2 residual components) and the most leaves (10 in the reference), so
# if it clears, the other two will. The memory peak lands at the FIRST
# SSBroyden Hessian update, i.e. within the first minute of the root segment
# -- a crash shows up almost immediately, not hours in.
#
# ── ROOT SIZE AND WHY IT STOPS HERE ──────────────────────────────────────
# [2, 64,64,64,64,64, out] = 16,897 params (16,962 for schrodinger).
#
# scimba's SSBroyden keeps a DENSE n x n inverse Hessian, state["Hk"] =
# torch.eye(nbparams), and its update materialises three more n x n
# temporaries plus expression temporaries:
#     temp1 = Hkyk Hkyk^T / .. ;  temp2 = phi v v^T ;  temp3 = s s^T / ..
#     H_kp1 = (1/tau)*(Hk - temp1 + temp2) + temp3
# so peak ~ 6 n^2 doubles. trainer/setup.py:144 sets the default device for
# full-batch optimizers, so this is VRAM on the A10G (24 GB), not host RAM.
#
#   root architecture            params    Hk alone   peak ~6n^2
#   [2, 60x4, 1] (old runs)      11,221      1.0 GB       6.0 GB
#   [2, 64x5, out]  <- THIS      16,897      2.3 GB      13.7 GB   ~10 GB spare
#   [2, 80x4, 1]                 19,761      3.1 GB      18.7 GB   coin flip
#   [2, 100x3, 1]                20,601      3.4 GB      20.4 GB   OOM
#   [2, 100x5, 1]                40,801     13.3 GB      79.9 GB   OOM
#
# Memory goes as n^2, so 3.6x the parameters costs 13x the memory. Nothing in
# this config file moves that term -- n_residual_train, rad_pool_*, batch_size
# all miss it, because the Hessian does not depend on the data at all. The
# only real lever is rewriting the update with in-place rank-1 addr_ calls
# (6 n^2 -> 1 n^2), which is a patch to a vendored dependency and is
# deliberately NOT part of this results run.
#
# Phase 3 and the fine-tune build ONE optimizer over all leaf experts
# jointly, so they have their own n^2: at 20-wide experts, 10 leaves = 9,420
# params = 4.3 GB, 15 leaves = 9.6 GB, 20 leaves = 17.0 GB. M_experts_num 8
# gave 6/7/10 leaves in the reference runs (M is the M-term budget, not a
# leaf cap -- the ancestor closure sets the final count), so 6-11 is expected
# and safe. WATCH THE LEAF COUNT in the schrodinger log; if a segment reports
# more than ~15 leaves, raise wavelet_threshold before running the rest.
#
# Recommended on the box (fragmentation, not capacity -- several multi-GB
# blocks per step in a 24 GB pool):
#     export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#
# ── SEGMENTS ─────────────────────────────────────────────────────────────
# root       adaptive_pinn.initial_train.epochs = 40000, SSBroyden from step 1
#            (no Adam warmup), RAD 0.5 / phi quadratic, resample every 500.
# phase 3    top-level `epochs` = 40000, SSBroyden. NOTE: phase 3 FORCE-
#            DISABLES adaptive sampling in code (trainer/epoch_loop.py) and
#            draws uniformly per expert -- the decomposition has already done
#            the spatial adaptation, and the split loss reduces per expert so
#            extra points in one leaf do not reweight it. The resample
#            cadence (500) is unchanged. This is by design, not an oversight.
# fine-tune  adaptive_pinn.fine_tune.epochs = 40000, SSBroyden, RAD 0.5,
#            adaptive collars sized from the root at q=0.9 clamped to
#            [0.03, 0.5], no corrector, collar_data_ratio 0.
#
# Since phase 3 runs for real here, sampling.min_points_per_expert is set to
# 1024: the per-expert draw gives each leaf its share of the budget by volume
# (n_e = N * vol_e / vol_domain), and a thin leaf around a sharp feature
# would otherwise get almost no residual points and stop training.
#
# Budget: 3 PDEs x 3 segments x 40k = 360k SSBroyden iterations. Early stop
# per segment after 10 evals (10k epochs) without a 1% improvement, no grace
# period. Note the patience now applies to the ROOT too -- a root that
# plateaus will hand a less-converged u_0 to the tree rather than burning the
# full 40k. That is intended, but it is a change from the old runs.
#
# RUNTIME: the root's Hessian update touches ~3x the elements of the
# fine-tune-only runs (n=16,897 vs 9,420) and there are now three segments
# per PDE instead of one. Check the step time in the first schrodinger root
# before assuming the whole sweep fits the window.
#
# This is the DEFAULT plan: `python run_experiments.py` with no argument
# reads experiments_plan.yaml, so AWS_scripts/run_and_terminate.sh launches
# it as-is. A copy is kept at experiment_plans/full_flow_root64x5_rad.yaml.
#
# Run:  python run_experiments.py
#   or: bash AWS_scripts/run_and_terminate.sh      (runs, then stops the box)
# ══════════════════════════════════════════════════════════════════════════
base_config:
  activation: tanh
  adam:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  adaptive_pinn:
    AToE_threshold_capacity: null
    M_experts_num: 8
    blending_mode: soft
    enable_gradient_diagnostics: false
    enable_timing: false
    enabled: true
    expert_type: mlp
    fine_tune:
      # Adaptive collar geometry: per-face widths sized from the root's
      # directional gradient at quantile 0.9, clamped to [0.03, 0.5] in
      # sigma_fraction units. sigma_fraction below is the FALLBACK only --
      # it applies if collar sizing fails.
      adaptive_collar_grid: 257
      adaptive_collar_quantile: 0.9
      adaptive_collar_sigma_max: 0.5
      adaptive_collar_sigma_min: 0.03
      adaptive_collar_size: true
      corrector_architecture: null
      corrector_init: zero
      epochs: 40000
      lr: 0.0001
      lr_schedule: none
      min_epochs: 1
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
      sigma_fraction: 0.05
      single_corrector: false
    initial_train:
      # ROOT segment. SSBroyden from step 1 -- no Adam warmup.
      epochs: 40000
      lr: 0.001
      lr_decay_rate: 0.98
      lr_decay_steps: 1000
      lr_schedule: none
      lr_warmup_steps: 0
      optimizer_1: ssbroyden
      optimizer_2: null
      optimizer_switch_epoch: 99999
    max_experts: 150
    split_icbc:
      enabled: true
    tree_max_depth: 15
    tree_min_samples_leaf: 50
    variable_for_expert_size: norm
    variable_for_node_accept: norm
  allen_cahn:
    D: 0.0001
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 3.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.04
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    # Drives the leaf count. A better root produces smaller detail
    # coefficients, so this should yield the same or FEWER leaves than the
    # 7 the 60x4 root gave. Raise it if a run reports more than ~15.
    wavelet_threshold: 0.002
    window_smoothness_order: 2
    window_type: smoothstep
  batch_size: 99999
  burgers1d:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 0.015
    nu: 0.01
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.5
    # 6 leaves off the 60x4 root. See the allen_cahn note above.
    wavelet_threshold: 0.001
    window_smoothness_order: 2
    window_type: smoothstep
  cuda: true
  # PHASE 3 budget (the top-level `epochs` key is the phase-3 segment).
  epochs: 40000
  eval_every: 1000
  eval_only: false
  kdv:
    adaptive_sampling:
      adaptive_ratio: 0.3
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 16
      tol_schedule:
      - 0.01
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 2.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 1000
    mu: 0.022
    new_norm_threshold: 0.2
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -1.0
      - 1.0
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 3
    tree_smoothness_threshold: 0.4
    wavelet_threshold: 0.0025
    window_smoothness_order: 3
    window_type: smoothstep
  ks:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: false
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    alpha: 6.25
    beta: 0.390625
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1
    expert_grad_clip_norm: null
    fourier_features:
      dim: 10
      enabled: false
      periodic: false
      scale: 1.0
    gamma: 0.00152587890625
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 10.0
    output_dim: 1
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - 0.0
      - 6.283185307179586
    temporal_domain:
    - 0.0
    - 1.0
    time_marching:
      enabled: true
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.3
    wavelet_threshold: 0.04
    window_smoothness_order: 4
    window_type: smoothstep
  lbfgs:
    history_size: 100
    line_search: strong_wolfe
    lr: 1.0
    max_iter: 1
    tolerance_change: 0.0
    tolerance_grad: 0.0
  lr: 0.001
  lr_decay_rate: 0.98
  lr_decay_steps: 1000
  lr_schedule: none
  lr_warmup_start_factor: 0.01
  lr_warmup_steps: 0
  min_epochs: 1
  model: AToELeaves
  # These top-level keys are the PHASE 3 segment's optimizer (orchestrator
  # passes cfg itself as phase 3's segment config). SSBroyden throughout, no
  # Adam warmup, so no switch.
  optimizer_1: ssbroyden
  optimizer_2: null
  optimizer_switch_epoch: 99999
  # 10 evals x eval_every 1000 = 10k epochs without a 1% improvement.
  # Applies PER SEGMENT, including the root.
  patience_evals: 10
  patience_rel_delta: 0.01
  precision: float64
  print_every: 1000
  problem: schrodinger
  profiling:
    enabled: false
  resume_from: null
  sampling:
    collar_data_ratio: 0.0
    collar_margin: 1.0
    eval_train_ratio: 0.25
    # Floor on residual points per leaf in phase 3. The per-expert draw sizes
    # each leaf by volume (n_e = N * vol_e / vol_domain), so a thin leaf
    # around a sharp feature would otherwise be starved and stop training.
    min_points_per_expert: 1024
    n_boundary_train: 256
    n_initial_train: 256
    n_residual_train: 20000
    plot_samples_every: 1000
    # RAD candidate pool, redrawn uniformly every resample_every_epochs.
    # 100k against a 10k adaptive draw (n_residual_train x adaptive_ratio)
    # also puts the sampler on its without-replacement path (pool >= 4x draw).
    rad_pool_size: 100000
    # Below the 20000 default: the pool probe is a forward with 2nd
    # derivatives in float64, and in the fine-tune it runs over every leaf.
    # Chunks are independent, so this is numerically identical.
    rad_pool_chunk: 5000
    # SSBroyden honours this directly (the every-epoch override is Adam/SOAP
    # only), so both the collocation redraw and the RAD re-target happen here.
    # Applies to all three segments.
    resample_every_epochs: 500
    sample_volume_ratio: 35
  save_every: 999999
  schrodinger:
    adaptive_sampling:
      adaptive_ratio: 0.5
      enabled: true
      phi: quadratic
      phi_epsilon: 1.0
      phi_power: 2.0
    causal_training:
      enabled: false
      min_weight_threshold: 0.99
      num_chunks: 32
      tol_schedule:
      - 0.01
      - 0.1
      - 1.0
    expert_grad_clip_norm: null
    fourier_features:
      dim: 128
      enabled: false
      periodic: false
      scale: 1.0
    grad_clip_norm: null
    init:
      hidden: default
      ls_use_bias: false
      output: default
    loss_weights:
      bc: 1.0
      continuity: 0.0
      ic: 1.0
      residual: 1.0
    lra:
      alpha: 0.1
      enabled: false
      epsilon: 1.0e-05
      scheme: grad_norm
      update_every: 100
    new_norm_threshold: 2.0
    output_dim: 2
    pretrained_base_checkpoint: null
    pretrained_local_expert_checkpoint: null
    rwf:
      enabled: false
      mean: 1.0
      std: 0.1
    spatial_dim: 1
    spatial_domain:
    - - -5.0
      - 5.0
    temporal_domain:
    - 0.0
    - 1.5707963267948966
    time_marching:
      enabled: false
      freeze_previous_windows: true
      m_distribution: quadratic
      num_windows: 5
    tree_smoothness_threshold: 0.7
    # 10 leaves off the 60x4 root -- the highest of the three, and the one to
    # watch. 15 leaves would be 9.6 GB in phase 3, 20 would be 17.0 GB.
    wavelet_threshold: 0.1
    window_smoothness_order: 2
    window_type: smoothstep
  seed: 42
  soap:
    betas:
    - 0.95
    - 0.95
    precondition_frequency: 10
    weight_decay: 0.0
  ssbroyden:
    lr: 1.0
    tolerance_grad: 1.0e-10
experiment_name: full_flow_root64x5_rad
experiments:
# Root [2, 64,64,64,64,64, out] = 16,897 params (16,962 for schrodinger)
# -> SSBroyden peak ~13.7 GB of the A10G's 24 GB.
# Experts stay [2, 20,20,20, out] = 921/942 params each.
#
# SCHRODINGER FIRST: same root size, largest graph, most leaves. The memory
# peak lands at the first Hessian update in the root segment, so an OOM
# surfaces within the first minute rather than hours in.
- name: schrodinger_full_flow
  problem: schrodinger
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 2]
  experts_architecture: [2, 20, 20, 20, 2]
- name: burgers1d_full_flow
  problem: burgers1d
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 1]
  experts_architecture: [2, 20, 20, 20, 1]
- name: allen_cahn_full_flow
  problem: allen_cahn
  model: AToELeaves
  base_architecture: [2, 64, 64, 64, 64, 64, 1]
  experts_architecture: [2, 20, 20, 20, 1]
